<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>TfL Status Simplified</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
      background: #f2f2f2;
      
      /* TfL Official Line Colors */
      --color-bakerloo: #B16300;
      --color-central: #E32017;
      --color-circle: #FFD300;
      --color-district: #00782A;
      --color-hammersmith-city: #F589A6;
      --color-jubilee: #A0A5A9;
      --color-metropolitan: #9B0056;
      --color-northern: #000000;
      --color-piccadilly: #0019A8;
      --color-victoria: #0098D4;
      --color-waterloo-city: #95CDBA;
      --color-dlr: #00A4A6;
      --color-london-overground: #EE7C0E;
      --color-elizabeth: #6950A1;
      --color-tram: #84B817;
      --color-default: #777777;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f2; }
    header {
      background: #111;
      color: white;
      padding: calc(18px + env(safe-area-inset-top)) 18px 18px;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; color: #d0d0d0; font-size: 14px; }
    
    /* Navigation Tab Switcher */
    .tab-bar {
      display: flex;
      background: #222;
      padding: 4px;
      margin-top: 14px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      color: #aaa;
      border: 0;
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: #fff;
      color: #111;
    }

    main { max-width: 760px; margin: auto; padding: 16px; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; margin-bottom: 14px; flex-wrap: wrap;
    }
    .controls { display: flex; align-items: center; gap: 12px; }
    #updated { color: #666; font-size: 13px; }
    button.refresh {
      border: 0; border-radius: 9px; padding: 9px 13px;
      font-weight: 700; cursor: pointer; background: #111; color: white;
    }
    .card {
      background: white; border-radius: 12px; margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden;
      border-left: 8px solid var(--line-color, var(--color-default));
    }
    .top {
      padding: 15px; display: flex; justify-content: space-between;
      gap: 12px; align-items: center;
    }
    .line-name { font-size: 18px; font-weight: 800; }
    .status { font-size: 14px; font-weight: 800; text-align: right; }
    .good .status { color: #148a36; }
    .bad .status { color: #c62828; }
    .warning .status { color: #a66200; }
    .details { padding: 0 15px 15px; border-top: 1px solid #eee; }
    
    /* Planned Works Styling */
    .date-badge {
      display: inline-block;
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffe0b2;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      margin-top: 12px;
      margin-bottom: 8px;
    }
    .planned-desc {
      font-size: 14px;
      line-height: 1.4;
      color: #333;
    }

    /* Collapsible Map Details */
    details.map-details {
      margin-top: 12px;
    }
    details.map-details summary {
      color: #111;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      padding: 4px 0;
    }

    /* Visual Line Route Diagram */
    .line-diagram {
      display: flex; flex-direction: column; margin: 14px 0 10px 8px;
    }
    .diagram-node {
      display: flex; align-items: center; gap: 12px; position: relative; padding: 5px 0;
    }
    .diagram-node::before {
      content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
      width: 4px; background: var(--line-color, var(--color-default)); opacity: 0.3; z-index: 1;
    }
    .diagram-node:first-child::before { top: 50%; }
    .diagram-node:last-child::before { bottom: 50%; }
    .diagram-node.segment-affected::before { background: #c62828; opacity: 1; width: 6px; left: 6px; }
    
    .dot {
      width: 18px; height: 18px; border-radius: 50%; background: white;
      border: 4px solid var(--line-color, var(--color-default)); z-index: 2; flex-shrink: 0;
    }
    .diagram-node.node-affected .dot {
      background: #c62828; border-color: #c62828;
    }
    .node-name { font-size: 13px; color: #666; }
    .diagram-node.node-affected .node-name { color: #c62828; font-weight: 800; }

    /* Standard station tags layout */
    .stations { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .station { background: #eee; border-radius: 999px; padding: 6px 9px; font-size: 13px; }
    .station.affected-pill {
      background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-weight: 700;
    }

    details.raw-details { margin-top: 10px; }
    details.raw-details summary { color: #555; font-size: 13px; font-weight: 600; }
    .raw {
      background: #f5f5f5; padding: 10px; margin-top: 8px;
      font-size: 13px; line-height: 1.4; border-radius: 6px;
    }
    .message { background: white; padding: 18px; border-radius: 12px; }
  </style>
</head>
<body>
<header>
  <h1>TfL Status Simplified</h1>
  <p>See which parts of a line are affected, without deciphering TfL's wording.</p>
  
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-live">Live Status</button>
    <button class="tab-btn" id="tab-planned">Planned Works</button>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="controls">
      <button class="refresh" id="refresh">Refresh</button>
    </div>
    <div id="updated">Loading…</div>
  </div>
  <div id="results"><div class="message">Loading TfL status…</div></div>
</main>

<script>
const API_LIVE = "https://api.tfl.gov.uk/Line/Mode/tube,dlr,elizabeth-line,overground/Status?detail=true";
const API_PLANNED = "https://api.tfl.gov.uk/Line/Mode/tube,dlr,elizabeth-line,overground/Disruption";

let currentTab = "live";

// TfL Official Color CSS Variable Mapper
const LINE_COLORS = {
  "bakerloo": "var(--color-bakerloo)",
  "central": "var(--color-central)",
  "circle": "var(--color-circle)",
  "district": "var(--color-district)",
  "hammersmith-city": "var(--color-hammersmith-city)",
  "jubilee": "var(--color-jubilee)",
  "metropolitan": "var(--color-metropolitan)",
  "northern": "var(--color-northern)",
  "piccadilly": "var(--color-piccadilly)",
  "victoria": "var(--color-victoria)",
  "waterloo-city": "var(--color-waterloo-city)",
  "dlr": "var(--color-dlr)",
  "london-overground": "var(--color-london-overground)",
  "elizabeth": "var(--color-elizabeth)",
  "tram": "var(--color-tram)"
};

// Line route station maps
const LINE_ROUTES = {
  "london-overground": [
    "Richmond", "Kew Gardens", "Gunnersbury", "South Acton", "Acton Central", 
    "Willesden Junction", "Kensal Rise", "Brondesbury Park", "Brondesbury", 
    "West Hampstead", "Finchley Road & Frognal", "Hampstead Heath", "Gospel Oak", 
    "Upper Holloway", "Crouch Hill", "Harringay Green Lanes", "Tottenham Hale", 
    "Blackhorse Road", "Walthamstow Queen's Road", "Leyton Midland Road", 
    "Leytonstone High Road", "Wanstead Park", "Woodgrange Park", "Barking", "Barking Riverside",
    "Clapham Junction"
  ],
  "victoria": [
    "Brixton", "Stockwell", "Vauxhall", "Pimlico", "Victoria", "Green Park", 
    "Oxford Circus", "Warren Street", "Euston", "King's Cross St Pancras", 
    "Highbury & Islington", "Finsbury Park", "Seven Sisters", "Tottenham Hale", 
    "Blackhorse Road", "Walthamstow Central"
  ],
  "bakerloo": [
    "Harrow & Wealdstone", "Kenton", "South Kenton", "North Wembley", "Wembley Central",
    "Stonebridge Park", "Harlesden", "Willesden Junction", "Kensal Green", "Queen's Park",
    "Kilburn Park", "Maida Vale", "Warwick Avenue", "Paddington", "Edgware Road",
    "Marylebone", "Baker Street", "Regent's Park", "Oxford Circus", "Piccadilly Circus",
    "Charing Cross", "Embankment", "Waterloo", "Lambeth North", "Elephant & Castle"
  ],
  "central": [
    "Ealing Broadway", "West Acton", "North Acton", "Hanger Lane", "Perivale", "Greenford", 
    "Northolt", "South Ruislip", "Ruislip Gardens", "West Ruislip", "White City", 
    "Shepherd's Bush", "Holland Park", "Notting Hill Gate", "Queensway", "Lancaster Gate", 
    "Marble Arch", "Bond Street", "Oxford Circus", "Tottenham Court Road", "Holborn", 
    "Chancery Lane", "St Paul's", "Bank", "Liverpool Street", "Bethnal Green", "Mile End", 
    "Stratford", "Leyton", "Leytonstone", "Wanstead", "Redbridge", "Gants Hill", 
    "Newbury Park", "Barkingside", "Fairlop", "Hainault", "Grange Hill", "Chigwell", 
    "Roding Valley", "Snaresbrook", "South Woodford", "Woodford", "Buckhurst Hill", "Loughton", "Debden", "Theydon Bois", "Epping"
  ],
  "jubilee": [
    "Stanmore", "Canons Park", "Queensbury", "Kingsbury", "Wembley Park", "Neasden", 
    "Dollis Hill", "Willesden Green", "Kilburn", "West Hampstead", "Finchley Road", 
    "Swiss Cottage", "St John's Wood", "Baker Street", "Bond Street", "Green Park", 
    "Westminster", "Waterloo", "Southwark", "London Bridge", "Bermondsey", 
    "Canada Water", "Canary Wharf", "North Greenwich", "Canning Town", "Stratford"
  ],
  "northern": [
    "Edgware", "Burnt Oak", "Colindale", "Hendon Central", "Brent Cross", "Golders Green",
    "Hampstead", "Belsize Park", "Chalk Farm", "Camden Town", "Euston", "King's Cross St Pancras",
    "Angel", "Old Street", "Moorgate", "Bank", "London Bridge", "Borough", "Elephant & Castle",
    "Kennington", "Oval", "Stockwell", "Clapham North", "Clapham Common", "Clapham South",
    "Balham", "Tooting Bec", "Tooting Broadway", "Colliers Wood", "South Wimbledon", "Morden"
  ],
  "piccadilly": [
    "Uxbridge", "Hillingdon", "Ickenham", "Ruislip", "Ruislip Manor", "Eastcote", "Rayners Lane",
    "South Harrow", "Sudbury Hill", "Sudbury Town", "Alperton", "Park Royal", "North Ealing",
    "Ealing Common", "Acton Town", "Turnham Green", "Hammersmith", "Barons Court", "Earl's Court",
    "South Kensington", "Knightsbridge", "Hyde Park Corner", "Green Park", "Piccadilly Circus",
    "Leicester Square", "Covent Garden", "Holborn", "Russell Square", "King's Cross St Pancras",
    "Caledonian Road", "Holloway Road", "Arsenal", "Finsbury Park", "Manor House", "Turnpike Lane",
    "Wood Green", "Bounds Green", "Arnos Grove", "Southgate", "Oakwood", "Cockfosters"
  ]
};

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value || "";
  return div.innerHTML;
}

function formatDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  if (isNaN(d)) return null;
  return d.toLocaleDateString('en-GB', {
    weekday: 'short',
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });
}

function classify(status) {
  const text = status?.statusSeverityDescription || "Unknown";
  const lower = text.toLowerCase();
  if (lower.includes("good")) return { cls: "good", text: "Good service" };
  if (lower.includes("minor") || lower.includes("part closure") || lower.includes("reduced"))
    return { cls: "warning", text };
  return { cls: "bad", text };
}

function getAffectedIndices(lineId, description) {
  const route = LINE_ROUTES[lineId] || [];
  const affectedIndices = new Set();
  if (!description) return { route, affectedIndices };

  const lowerDesc = description.toLowerCase();
  const betweenRegex = /between\s+([a-z0-9\s&'-]+?)\s+and\s+([a-z0-9\s&'-]+?)(?=\s+due|\s+while|\s+and|\.|$)/gi;
  let match;

  while ((match = betweenRegex.exec(lowerDesc)) !== null) {
    const rawStart = match[1].trim();
    const rawEnd = match[2].trim();

    const idxA = route.findIndex(s => rawStart.includes(s.toLowerCase()) || s.toLowerCase().includes(rawStart));
    const idxB = route.findIndex(s => rawEnd.includes(s.toLowerCase()) || s.toLowerCase().includes(rawEnd));

    if (idxA !== -1 && idxB !== -1) {
      const start = Math.min(idxA, idxB);
      const end = Math.max(idxA, idxB);
      for (let i = start; i <= end; i++) affectedIndices.add(i);
    }
  }

  if (affectedIndices.size === 0) {
    route.forEach((station, idx) => {
      if (lowerDesc.includes(station.toLowerCase())) affectedIndices.add(idx);
    });
  }

  return { route, affectedIndices };
}

function buildDiagramHtml(route, affectedIndices) {
  return `<div class="line-diagram">` + 
    route.map((station, i) => {
      const isAffected = affectedIndices.has(i);
      const isNextAffected = affectedIndices.has(i + 1);
      const segmentClass = (isAffected && isNextAffected) ? 'segment-affected' : '';
      return `
        <div class="diagram-node ${isAffected ? 'node-affected' : ''} ${segmentClass}">
          <div class="dot"></div>
          <div class="node-name">${escapeHtml(station)}</div>
        </div>
      `;
    }).join('') +
  `</div>`;
}

function cardLive(line) {
  const status = line.lineStatuses?.[0];
  if (!status) return "";

  const info = classify(status);
  const description = status.reason || status.disruption?.description || "";
  const { route, affectedIndices } = getAffectedIndices(line.id, description);
  const lineColor = LINE_COLORS[line.id] || "var(--color-default)";

  if (info.cls === "good") {
    return `<article class="card good" style="--line-color: ${lineColor};">
      <div class="top">
        <div class="line-name">${escapeHtml(line.name)}</div>
        <div class="status">Good service</div>
      </div>
    </article>`;
  }

  const stationPills = Array.from(affectedIndices).map(idx => 
    `<span class="station affected-pill">${escapeHtml(route[idx])}</span>`
  ).join("");

  let routeVisualization = "";
  if (route.length > 0) {
    routeVisualization = `
      <details class="map-details">
        <summary>🗺️ Show visual route map</summary>
        ${buildDiagramHtml(route, affectedIndices)}
      </details>
    `;
  }

  return `<article class="card ${info.cls}" style="--line-color: ${lineColor};">
    <div class="top">
      <div class="line-name">${escapeHtml(line.name)}</div>
      <div class="status">${escapeHtml(info.text)}</div>
    </div>
    <div class="details">
      ${stationPills ? `<div class="stations">${stationPills}</div>` : ""}
      ${routeVisualization}
      ${description ? `
        <details class="raw-details">
          <summary>Show TfL's original description</summary>
          <div class="raw">${escapeHtml(description)}</div>
        </details>` : ""}
    </div>
  </article>`;
}

function cardPlanned(item) {
  const category = item.categoryDescription || "Planned Work";
  const description = item.description || "No detail provided.";
  
  const start = formatDate(item.fromDate);
  const end = formatDate(item.toDate);
  
  let dateText = "";
  if (start && end) {
    dateText = start === end ? `📅 ${start}` : `📅 ${start} — ${end}`;
  } else if (start) {
    dateText = `📅 From ${start}`;
  } else if (end) {
    dateText = `📅 Until ${end}`;
  }

  return `<article class="card warning">
    <div class="top">
      <div class="line-name">${escapeHtml(category)}</div>
      <div class="status">Planned Work</div>
    </div>
    <div class="details">
      ${dateText ? `<div class="date-badge">${escapeHtml(dateText)}</div>` : ""}
      <div class="planned-desc">${escapeHtml(description)}</div>
    </div>
  </article>`;
}

async function loadStatus() {
  const results = document.getElementById("results");
  const updated = document.getElementById("updated");

  results.innerHTML = `<div class="message">Loading ${currentTab === "live" ? "live status" : "planned works"}…</div>`;

  try {
    if (currentTab === "live") {
      const response = await fetch(API_LIVE);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();

      data.sort((a, b) => {
        const ag = (a.lineStatuses?.[0]?.statusSeverityDescription || "").toLowerCase().includes("good");
        const bg = (b.lineStatuses?.[0]?.statusSeverityDescription || "").toLowerCase().includes("good");
        return Number(ag) - Number(bg);
      });

      results.innerHTML = data.map(cardLive).join("");
    } else {
      const response = await fetch(API_PLANNED);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();

      if (!data || data.length === 0) {
        results.innerHTML = `<div class="message">No planned closures currently scheduled.</div>`;
      } else {
        results.innerHTML = data.map(cardPlanned).join("");
      }
    }

    updated.textContent = "Last checked " + new Date().toLocaleTimeString();
  } catch (error) {
    console.error(error);
    results.innerHTML = `
      <div class="message">
        <strong>Couldn't load information.</strong>
        <p>Check your internet connection and try again.</p>
      </div>`;
    updated.textContent = "Unable to update";
  }
}

// Tab Switching Mechanics
document.getElementById("tab-live").addEventListener("click", (e) => {
  currentTab = "live";
  e.target.classList.add("active");
  document.getElementById("tab-planned").classList.remove("active");
  loadStatus();
});

document.getElementById("tab-planned").addEventListener("click", (e) => {
  currentTab = "planned";
  e.target.classList.add("active");
  document.getElementById("tab-live").classList.remove("active");
  loadStatus();
});

document.getElementById("refresh").addEventListener("click", loadStatus);

loadStatus();
setInterval(loadStatus, 60_000);
</script>
</body>
</html>
