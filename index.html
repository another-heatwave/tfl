<html lang="en">

  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --bg-color: #f2f2f2;
      --card-bg: #ffffff;
      --text-color: #111111;
      --text-muted: #555555;
      --border-color: #eeeeee;
      --input-bg: #ffffff;
      --toolbar-bg: #eaeaea;
      
      /* TfL Official Line Colors */
      --color-bakerloo: #B16300;
      --color-central: #E32017;
      --color-circle: #FFD300;
      --color-district: #00782A;
      --color-hammersmith-city: #F589A6;
      --color-jubilee: #A0A5A9;
      --color-metropolitan: #9B0056;
      --color-northern: #000000;
      --color-piccadilly: #0019A8;
      --color-victoria: #0098D4;
      --color-waterloo-city: #95CDBA;
      --color-dlr: #00A4A6;
      --color-elizabeth: #6950A1;
      --color-tram: #84B817;
      --color-national-rail: #d2172a;
      
      /* Overground Named Line Colors */
      --color-mildmay: #2774ae;
      --color-windrush: #d22730;
      --color-weaver: #893b67;
      --color-suffragette: #5ba763;
      --color-lioness: #ef9600;
      --color-liberty: #606667;
      --color-default: #EE7C0E;

      /* Status Palette */
      --status-closed: #c62828;
      --status-severe: #e65100;
      --status-minor: #d97706;
      --status-good: #148a36;
      --status-planned: #d97706;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --text-muted: #bbbbbb;
      --border-color: #2c2c2c;
      --input-bg: #2a2a2a;
      --toolbar-bg: #1a1a1a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg-color); color: var(--text-color);
      min-height: 100vh; display: flex; flex-direction: column;
      transition: background 0.2s ease, color 0.2s ease;
      font-size: 15px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    header {
      background: #111; color: white;
      padding: calc(18px + env(safe-area-inset-top)) 18px 18px;
    }
    header h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    header p { margin: 5px 0 0; color: #d0d0d0; font-size: 14px; }
    
    .tab-bar {
      display: flex; background: #222; padding: 4px;
      margin-top: 14px; border-radius: 10px; flex-wrap: wrap; gap: 4px;
    }
    .tab-btn {
      flex: 1; background: transparent; color: #aaa; border: 0;
      padding: 10px 6px; font-size: 14px; font-weight: 700; cursor: pointer;
      border-radius: 8px; transition: all 0.2s ease; text-align: center; white-space: nowrap;
    }
    .tab-btn.active { background: #fff; color: #111; }

    main { max-width: 840px; width: 100%; margin: auto; padding: 16px; flex: 1; }
    
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px; background: var(--card-bg); padding: 10px 14px;
      border-radius: 10px; border: 1px solid var(--border-color);
    }

    .controls { display: flex; align-items: center; gap: 12px; }
    .toggle-theme {
      font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    #updated { color: var(--text-muted); font-size: 13px; font-weight: 600; }
    
    button.btn-refresh {
      border: 0; border-radius: 8px; padding: 8px 14px;
      font-weight: 700; cursor: pointer; background: #111; color: white;
      font-size: 14px; display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.2s ease;
    }
    body.dark-mode button.btn-refresh { background: #333; }
    button.btn-refresh:hover { opacity: 0.9; }

    button.btn-back {
      border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 14px;
      font-weight: 700; cursor: pointer; background: var(--card-bg); color: var(--text-color);
      font-size: 14px; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px;
    }

    .card {
      background: var(--card-bg); border-radius: 12px; margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden;
      border-left: 8px solid var(--line-color, var(--color-default));
    }
    .top {
      padding: 14px 15px; display: flex; justify-content: space-between;
      gap: 12px; align-items: center;
    }
    .line-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    
    .line-badge {
      background: var(--line-color, var(--color-default));
      color: var(--badge-text, #fff); font-size: 14px; font-weight: 800;
      padding: 6px 12px; border-radius: 6px; display: inline-block; letter-spacing: 0.2px;
    }

    .planned-tag {
      background: rgba(217, 119, 6, 0.15); color: var(--status-planned);
      border: 1px solid var(--status-planned); font-size: 11px; font-weight: 800;
      padding: 3px 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;
    }

    .status { font-size: 14px; font-weight: 800; text-align: right; }
    .status.good { color: var(--status-good); }
    .status.closed { color: var(--status-closed); }
    .status.severe { color: var(--status-severe); }
    .status.minor { color: var(--status-minor); }
    .status.planned { color: var(--status-planned); }
    
    .details { padding: 0 15px 15px; border-top: 1px solid var(--border-color); }

    .segment-summary {
      font-size: 14px; font-weight: 700; padding: 8px 12px;
      border-radius: 0 6px 6px 0; margin-top: 12px;
    }
    .segment-summary.closed { background: rgba(198, 40, 40, 0.15); border-left: 3px solid var(--status-closed); color: var(--status-closed); }
    .segment-summary.severe { background: rgba(230, 81, 0, 0.15); border-left: 3px solid var(--status-severe); color: var(--status-severe); }
    .segment-summary.minor { background: rgba(217, 119, 6, 0.15); border-left: 3px solid var(--status-minor); color: var(--status-minor); }
    .segment-summary.planned { background: rgba(217, 119, 6, 0.15); border-left: 3px solid var(--status-planned); color: var(--status-planned); }

    details.upcoming-works-details, details.works-more-details {
      margin-top: 10px; background: rgba(217, 119, 6, 0.08);
      border-left: 3px solid var(--status-planned); border-radius: 0 8px 8px 0;
      padding: 6px 12px;
    }
    details.works-more-details summary {
      cursor: pointer; outline: none; user-select: none;
      font-size: 13px; font-weight: 700; color: var(--status-planned);
    }

    .svg-tree-wrapper {
      width: 100%; overflow-x: auto; margin-top: 8px;
      padding: 8px 0 16px; background: var(--card-bg); border-radius: 8px;
    }
    .svg-tree-wrapper svg { display: block; }

    .horizontal-svg-wrapper {
      width: 100%; overflow-x: auto; margin-top: 10px;
      padding: 10px 0; background: var(--card-bg); border-radius: 8px;
      border: 1px solid var(--border-color); cursor: zoom-in; position: relative;
    }
    .horizontal-svg-wrapper::after {
      content: "🔍 Tap map to zoom"; position: absolute; top: 6px; right: 10px;
      font-size: 11px; font-weight: 700; color: var(--text-muted);
      background: var(--card-bg); padding: 2px 6px; border-radius: 4px;
      border: 1px solid var(--border-color); opacity: 0.85; pointer-events: none;
    }
    .horizontal-svg-wrapper svg { display: block; }

    .works-card {
      background: var(--card-bg); border-radius: 12px; padding: 16px;
      margin-bottom: 12px; border-left: 6px solid var(--status-planned);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);

    .works-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 6px; }
    .works-date { font-size: 12px; font-weight: 800; background: rgba(217, 119, 6, 0.15); color: var(--status-planned); padding: 4px 8px; border-radius: 6px; }

    .ic-badge-container {
      display: flex; flex-wrap: wrap; gap: 2px; align-items: center;

    }

    .ic-btn {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9.5px; font-weight: 800; padding: 2px 5px; border-radius: 4px;
      color: #fff; border: 0; cursor: pointer; text-transform: uppercase;
      vertical-align: middle; transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2); margin: 1px 2px; line-height: 1.2;
    }
    .ic-btn:hover { opacity: 0.85; transform: scale(1.05); }

    .network-container { background: var(--card-bg); border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .network-title { font-size: 18px; font-weight: 800; margin-bottom: 12px; }
    .network-section-heading {

    .network-card {

    details.raw-details summary { color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; }
    .raw { background: var(--border-color); padding: 10px; margin-top: 8px; font-size: 13px; line-height: 1.4; border-radius: 6px; }
    .message { background: var(--card-bg); padding: 18px; border-radius: 12px; text-align: center; color: var(--text-muted); }

    .zoom-modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; z-index: 2000; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease; backdrop-filter: blur(4px);
    }

    .zoom-modal-content {

      display: flex; flex-direction: column; align-items: center; position: relative;

    .zoom-modal-header {
      width: 100%; display: flex; justify-content: space-between; align-items: center;

    }

    .btn-close-zoom {

      color: var(--text-color); border-radius: 50%; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .zoom-svg-container { width: 100%; overflow-x: auto; padding: 10px 0; }
    .zoom-svg-container svg { min-width: 760px; height: auto; display: block; }
  </style>
</head>

<header>
  <h1>TfL Status Simplified</h1>
  <p>See which parts of a line are affected, without deciphering TfL's wording.</p>
  
  <div class="tab-bar">
    <button class="tab-btn active" id="tab-map">Live Status</button>
    <button class="tab-btn" id="tab-works">Upcoming Works</button>
  </div>
</header>

<main>
  <div class="toolbar" id="toolbar">
    <div class="controls">
      <button class="btn-refresh" id="btn-refresh">🔄 Refresh Status</button>
      <label class="toggle-theme">
        <input type="checkbox" id="dark-mode-toggle"> 🌙 Dark Mode
      </label>
    </div>
    <div id="updated">Loading…</div>
  </div>
  <div id="results"><div class="message">Loading status…</div></div>
</main>

<div class="zoom-modal-overlay" id="zoom-modal">
  <div class="zoom-modal-content">
    <div class="zoom-modal-header">
      <div class="zoom-modal-title" id="zoom-modal-title">Planned Works Route Map</div>
      <button class="btn-close-zoom" id="btn-close-zoom">&times;</button>
    </div>
    <div class="zoom-svg-container" id="zoom-svg-target"></div>
  </div>
</div>
<script>
function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value || "";
  return div.innerHTML;
}

function cleanStationName(str) {
  return str.toLowerCase().replace(/\s*(station|underground station|rail station|line)\s*/gi, '').trim();
}

function classify(statusText) {
  const lower = (statusText || "").toLowerCase();
  if (lower.includes("good")) return { type: "good", label: "Good service" };
  if (lower.includes("planned") || lower.includes("work")) return { type: "planned", label: statusText };
  if (lower.includes("no service") || lower.includes("suspended") || lower.includes("part closure") || lower.includes("closure")) return { type: "closed", label: statusText };
  if (lower.includes("severe")) return { type: "severe", label: statusText };
  if (lower.includes("minor") || lower.includes("delays") || lower.includes("reduced")) return { type: "minor", label: statusText };
  return { type: "minor", label: statusText || "Unknown" };
}

function getUpcomingWorkNotice(lineId) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const nextWeek = new Date(today);
  nextWeek.setDate(today.getDate() + 7);

  return PLANNED_SCHEDULE.find(item => {
    if (item.line !== lineId) return false;
    const start = new Date(item.startDate);
    const end = new Date(item.endDate);
    end.setHours(23, 59, 59, 999);

    return today <= end && start <= nextWeek;
  });
}

const darkModeToggle = document.getElementById("dark-mode-toggle");
if (localStorage.getItem("tfl_dark_mode") === "true") {
  document.body.classList.add("dark-mode");
  darkModeToggle.checked = true;
}
darkModeToggle.addEventListener("change", (e) => {
  if (e.target.checked) {
    document.body.classList.add("dark-mode");
    localStorage.setItem("tfl_dark_mode", "true");
  } else {
    document.body.classList.remove("dark-mode");
    localStorage.setItem("tfl_dark_mode", "false");
  }
});

function evaluateStationStatuses(lineId, lineStatuses) {
  const stationStatuses = new Map();
  const summaryBanners = [];

  function addBanner(type, text) {
    if (!summaryBanners.some(b => b.text === text)) {
      summaryBanners.push({ type, text });
    }
  }

  let allStations = [];
  if (LINE_TREES[lineId]) {
    const tree = LINE_TREES[lineId];
    allStations = [...tree.trunk];
    if (tree.branchesFromNode) {
      Object.values(tree.branchesFromNode).forEach(branches => {
        branches.forEach(b => allStations.push(...b));
      });
    }
  } else {
    allStations = LINE_ROUTES[lineId] || [];
  }

  const statusList = Array.isArray(lineStatuses) ? lineStatuses : [];

  statusList.forEach(status => {
    const mainSeverity = classify(status.statusSeverityDescription);
    const reason = status.reason || status.disruption?.description || "";
    const lowerReason = reason.toLowerCase();

    const isPlannedWork = lowerReason.includes("planned") || lowerReason.includes("work") || lowerReason.includes("engineering");
    const severityType = isPlannedWork ? "planned" : mainSeverity.type;

    const closedRegex = /(?:no service|suspended|part closure|closed|part suspended)\s+(?:between|from)\s+([a-z0-9\s&'-]+?)\s+(?:and|to)\s+([a-z0-9\s&'-]+?)(?=\s+due|\s+while|\s+and|\.|$)/gi;
    let match;
    let foundRange = false;

    while ((match = closedRegex.exec(lowerReason)) !== null) {
      const startStr = cleanStationName(match[1]);
      const endStr = cleanStationName(match[2]);

      const idxA = allStations.findIndex(s => cleanStationName(s) === startStr || cleanStationName(s).includes(startStr));
      const idxB = allStations.findIndex(s => cleanStationName(s) === endStr || cleanStationName(s).includes(endStr));

      if (idxA !== -1 && idxB !== -1) {
        foundRange = true;
        const start = Math.min(idxA, idxB);
        const end = Math.max(idxA, idxB);
        for (let i = start; i <= end; i++) {
          stationStatuses.set(allStations[i], severityType);
        }

        const branchTerminus = allStations[end];
        addBanner(severityType, `${isPlannedWork ? 'Planned Works' : mainSeverity.label} [${branchTerminus} Branch] (${allStations[start]} to ${allStations[end]})`);
      }
    }

    if (mainSeverity.type === "closed" && !foundRange) {
      allStations.forEach(st => stationStatuses.set(st, severityType));
      addBanner(severityType, isPlannedWork ? "Planned works across entire line" : "No service across entire line");
    }

    if (mainSeverity.type === "severe" && !foundRange) {
      allStations.forEach(st => stationStatuses.set(st, "severe"));
      addBanner("severe", "Severe Delays across entire line");
    } else if (mainSeverity.type === "minor" && !foundRange) {
      allStations.forEach(st => stationStatuses.set(st, "minor"));
      addBanner("minor", "Minor Delays across entire line");
    }
  });

  return { stationStatuses, summaryBanners };
}

function getInterchangeBadgesHtml(currentLineId, stationName) {
  const connectingLines = INTERCHANGE_DIRECTORY[stationName];
  if (!connectingLines) return "";

  const otherLines = connectingLines.filter(id => id !== currentLineId);
  if (otherLines.length === 0) return "";

  const badges = otherLines.map(id => {
    const conf = LINE_COLORS[id];
    if (!conf) return "";
    
    if (id === "national-rail") {
      return `<span class="ic-btn" style="background:${conf.hex}; color:${conf.text}; cursor:default;">NR</span>`;
    }

    const shortCode = conf.name.replace(/\s*line\s*/gi, '').substring(0, 3);
    return `<button class="ic-btn" style="background:${conf.hex}; color:${conf.text};" onclick="openLineDetailView('${id}'); event.stopPropagation();" title="Jump to ${escapeHtml(conf.name)}">${escapeHtml(shortCode)}</button>`;
  }).join("");

  return `<div class="ic-badge-container">${badges}</div>`;
}

// CONTINUOUS FLOW DIRECTED SVG GRAPH RENDERER
function renderSVGTreeDiagram(lineId, stationStatuses) {
  const lineConf = LINE_COLORS[lineId] || { hex: "#EE7C0E" };
  const baseColor = lineConf.hex;

  function getStatusStyle(status) {
    if (status === "closed") return { fill: "var(--status-closed)", stroke: "var(--status-closed)", symbol: " ⛔", text: "var(--status-closed)" };
    if (status === "severe") return { fill: "var(--status-severe)", stroke: "var(--status-severe)", symbol: " 🚨", text: "var(--status-severe)" };
    if (status === "minor") return { fill: "var(--status-minor)", stroke: "var(--status-minor)", symbol: " ⚠️", text: "var(--status-minor)" };
    if (status === "planned") return { fill: "var(--status-planned)", stroke: "var(--status-planned)", symbol: " 🚧", text: "var(--status-planned)" };
    return { fill: "#ffffff", stroke: baseColor, symbol: "", text: "var(--text-color)" };
  }

  if (!LINE_TREES[lineId]) {
    const route = LINE_ROUTES[lineId] || [];
    if (!Array.isArray(route) || route.length === 0) return '';

    const rowHeight = 30;
    const svgHeight = route.length * rowHeight + 30;

    let svgHtml = `<svg width="100%" height="${svgHeight}" viewBox="0 0 780 ${svgHeight}" preserveAspectRatio="xMinYMin meet">`;
    svgHtml += `<line x1="22" y1="14" x2="22" y2="${(route.length - 1) * rowHeight + 14}" stroke="${baseColor}" stroke-width="4.5" opacity="0.45" />`;

    route.forEach((st, i) => {
      const y = i * rowHeight + 14;
      const status = stationStatuses.get(st);
      const style = getStatusStyle(status);
      const icBadges = getInterchangeBadgesHtml(lineId, st);
      const isInterchange = Boolean(icBadges);

      if (isInterchange) {
        svgHtml += `<circle cx="22" cy="${y}" r="8.5" fill="#ffffff" stroke="#000000" stroke-width="3" />`;
        svgHtml += `<circle cx="22" cy="${y}" r="4" fill="${style.fill}" stroke="${style.stroke}" stroke-width="2" />`;
      } else {
        svgHtml += `<circle cx="22" cy="${y}" r="6" fill="${style.fill}" stroke="${style.stroke}" stroke-width="3" />`;
      }

      svgHtml += `<text x="40" y="${y + 4}" fill="${style.text}" font-size="13" font-weight="${status || isInterchange ? '700' : '600'}">${escapeHtml(st)}${style.symbol}</text>`;
      if (icBadges) {
        svgHtml += `<foreignObject x="260" y="${y - 11}" width="480" height="22">${icBadges}</foreignObject>`;
      }
    });

    svgHtml += `</svg>`;
    return `<div class="svg-tree-wrapper">${svgHtml}</div>`;
  }

  const tree = LINE_TREES[lineId];
  const rowHeight = 30;
  
  let totalRows = tree.trunk.length;
  if (tree.branchesFromNode) {
    Object.values(tree.branchesFromNode).forEach(branches => {
      let longest = 0;
      branches.forEach(b => { if (b.length > longest) longest = b.length; });
      totalRows += longest + 1;
    });
  }

  const svgHeight = (totalRows * rowHeight) + 120;
  let currY = 14;
  let nodeYMap = new Map();

  let svgHtml = `<svg width="100%" height="${svgHeight}" viewBox="0 0 780 ${svgHeight}" preserveAspectRatio="xMinYMin meet">`;

  tree.trunk.forEach((st, i) => {
    const y = currY;
    nodeYMap.set(st, y);

    if (i < tree.trunk.length - 1) {
      svgHtml += `<line x1="32" y1="${y}" x2="32" y2="${y + rowHeight}" stroke="${baseColor}" stroke-width="4.5" opacity="0.45" />`;
    }

    const status = stationStatuses.get(st);
    const style = getStatusStyle(status);
    const icBadges = getInterchangeBadgesHtml(lineId, st);
    const isInterchange = Boolean(icBadges);

    if (isInterchange) {
      svgHtml += `<circle cx="32" cy="${y}" r="8.5" fill="#ffffff" stroke="#000000" stroke-width="3" />`;
      svgHtml += `<circle cx="32" cy="${y}" r="4" fill="${style.fill}" stroke="${style.stroke}" stroke-width="2" />`;
    } else {
      svgHtml += `<circle cx="32" cy="${y}" r="6" fill="${style.fill}" stroke="${style.stroke}" stroke-width="3" />`;
    }

    svgHtml += `<text x="50" y="${y + 4}" fill="${style.text}" font-size="13" font-weight="${status || isInterchange ? '700' : '600'}">${escapeHtml(st)}${style.symbol}</text>`;
    if (icBadges) {
      svgHtml += `<foreignObject x="280" y="${y - 11}" width="480" height="22">${icBadges}</foreignObject>`;
    }
    
    currY += rowHeight;

    if (tree.branchesFromNode && tree.branchesFromNode[st]) {
      const branches = tree.branchesFromNode[st];
      const forkStartY = y;
      const branchStartY = currY;

      const xOffsets = [290, 540];
      let maxBranchLen = 0;

      branches.forEach((branchStations, bIdx) => {
        const targetX = xOffsets[bIdx] || (290 + bIdx * 250);
        if (branchStations.length > maxBranchLen) maxBranchLen = branchStations.length;

        svgHtml += `<path d="M 32 ${forkStartY} C 32 ${forkStartY + 18}, ${targetX} ${forkStartY + 10}, ${targetX} ${branchStartY}" stroke="${baseColor}" stroke-width="3.5" fill="none" opacity="0.5" />`;

        if (branchStations.length > 1) {
          svgHtml += `<line x1="${targetX}" y1="${branchStartY}" x2="${targetX}" y2="${branchStartY + (branchStations.length - 1) * rowHeight}" stroke="${baseColor}" stroke-width="3.5" opacity="0.45" />`;
        }

        let bY = branchStartY;
        branchStations.forEach((bSt) => {
          nodeYMap.set(bSt, bY);
          const bStatus = stationStatuses.get(bSt);
          const bStyle = getStatusStyle(bStatus);
          const bIcBadges = getInterchangeBadgesHtml(lineId, bSt);

          if (bIcBadges) {
            svgHtml += `<circle cx="${targetX}" cy="${bY}" r="7.5" fill="#ffffff" stroke="#000000" stroke-width="2.5" />`;
            svgHtml += `<circle cx="${targetX}" cy="${bY}" r="3.5" fill="${bStyle.fill}" stroke="${bStyle.stroke}" stroke-width="1.5" />`;
          } else {
            svgHtml += `<circle cx="${targetX}" cy="${bY}" r="5.5" fill="${bStyle.fill}" stroke="${bStyle.stroke}" stroke-width="2.5" />`;
          }

          svgHtml += `<text x="${targetX + 14}" y="${bY + 4}" fill="${bStyle.text}" font-size="12" font-weight="${bStatus || bIcBadges ? '700' : '600'}">${escapeHtml(bSt)}${bStyle.symbol}</text>`;
          
          if (bIcBadges) {
            const nextTrackX = xOffsets[bIdx + 1] || 760;
            const availableBadgeWidth = Math.max(nextTrackX - (targetX + 160), 100);
            svgHtml += `<foreignObject x="${targetX + 155}" y="${bY - 11}" width="${availableBadgeWidth}" height="22">${bIcBadges}</foreignObject>`;
          }
          bY += rowHeight;
        });

        // REJOIN LOOP LOGIC FOR CENTRAL LINE HAINAULT BRANCH TO WOODFORD
        const lastStationInBranch = branchStations[branchStations.length - 1];
        if (lastStationInBranch === "Woodford" && nodeYMap.has("Woodford")) {
          const woodfordY = nodeYMap.get("Woodford");
          const endBranchY = branchStartY + (branchStations.length - 1) * rowHeight;
          svgHtml += `<path d="M ${targetX} ${endBranchY} C ${targetX} ${endBranchY + 20}, 32 ${woodfordY - 10}, 32 ${woodfordY}" stroke="${baseColor}" stroke-width="3.5" fill="none" stroke-dasharray="4 4" opacity="0.75" />`;
        }
      });

      currY += (maxBranchLen * rowHeight) + 10;
    }
  });

  svgHtml += `</svg>`;
  return `<div class="svg-tree-wrapper">${svgHtml}</div>`;
}

function renderHorizontalWorksMap(lineId, descriptionText) {
  const lineConf = LINE_COLORS[lineId] || { var: "var(--color-default)", hex: "#EE7C0E", name: lineId.toUpperCase() };
  const baseColor = lineConf.hex;

  let stationList = [];
  if (LINE_TREES[lineId]) {
    const tree = LINE_TREES[lineId];
    stationList = [...tree.trunk];
    if (tree.branchesFromNode) {
      Object.values(tree.branchesFromNode).forEach(branches => {
        branches.forEach(b => stationList.push(...b));
      });
    }
  } else {
    stationList = LINE_ROUTES[lineId] || [];
  }

  if (stationList.length === 0) return "";

  const lowerDesc = (descriptionText || "").toLowerCase();
  const closedRegex = /(?:no service|suspended|part closure|closed|part suspended|between)\s+([a-z0-9\s&'-]+?)\s+(?:and|to)\s+([a-z0-9\s&'-]+?)(?=\s+due|\s+while|\s+and|\.|$)/gi;
  let match = closedRegex.exec(lowerDesc);

  let affectedStartIdx = -1;
  let affectedEndIdx = -1;

  if (match) {
    const startStr = cleanStationName(match[1]);
    const endStr = cleanStationName(match[2]);

    const idxA = stationList.findIndex(s => cleanStationName(s) === startStr || cleanStationName(s).includes(startStr));
    const idxB = stationList.findIndex(s => cleanStationName(s) === endStr || cleanStationName(s).includes(endStr));

    if (idxA !== -1 && idxB !== -1) {
      affectedStartIdx = Math.min(idxA, idxB);
      affectedEndIdx = Math.max(idxA, idxB);
    }
  }

  const colWidth = 45;
  const svgWidth = Math.max(stationList.length * colWidth + 60, 580);
  const trackY = 40;
  const svgHeight = 160;

  let svgHtml = `<svg width="100%" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="xMinYMin meet">`;

  svgHtml += `<line x1="30" y1="${trackY}" x2="${30 + (stationList.length - 1) * colWidth}" y2="${trackY}" stroke="${baseColor}" stroke-width="5" opacity="0.3" />`;

  if (affectedStartIdx !== -1 && affectedEndIdx !== -1) {
    const highlightX1 = 30 + affectedStartIdx * colWidth;
    const highlightX2 = 30 + affectedEndIdx * colWidth;
    svgHtml += `<line x1="${highlightX1}" y1="${trackY}" x2="${highlightX2}" y2="${trackY}" stroke="var(--status-planned)" stroke-width="6" />`;
  }

  stationList.forEach((st, i) => {
    const x = 30 + i * colWidth;
    const isAffected = (i >= affectedStartIdx && i <= affectedEndIdx) || (affectedStartIdx === -1 && lowerDesc.includes(cleanStationName(st)));

    let dotFill = "#ffffff", dotStroke = baseColor, textColor = "var(--text-muted)", tagSymbol = "";

    if (isAffected) {
      dotFill = "var(--status-planned)";
      dotStroke = "var(--status-planned)";
      textColor = "var(--status-planned)";
      tagSymbol = " 🚧";
    }

    svgHtml += `<circle cx="${x}" cy="${trackY}" r="${isAffected ? 6.5 : 5}" fill="${dotFill}" stroke="${dotStroke}" stroke-width="2.5" />`;
    svgHtml += `<text x="${x}" y="${trackY + 16}" fill="${textColor}" font-size="11" font-weight="${isAffected ? '700' : '600'}" transform="rotate(45, ${x}, ${trackY + 16})" text-anchor="start">${escapeHtml(st)}${tagSymbol}</text>`;
  });

  svgHtml += `</svg>`;

  const lineTitle = LINE_COLORS[lineId]?.name || "Planned Works";
  return `<div class="horizontal-svg-wrapper" onclick="openZoomModal('${escapeHtml(lineTitle)}', this.innerHTML)">${svgHtml}</div>`;
}

function openZoomModal(title, svgMarkup) {
  document.getElementById("zoom-modal-title").textContent = title + " - Route Map";
  document.getElementById("zoom-svg-target").innerHTML = svgMarkup;
  document.getElementById("zoom-modal").classList.add("open");
}

function closeZoomModal() {
  document.getElementById("zoom-modal").classList.remove("open");
}

document.getElementById("btn-close-zoom").addEventListener("click", closeZoomModal);
document.getElementById("zoom-modal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("zoom-modal")) closeZoomModal();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeZoomModal();
});

function openLineDetailView(lineId) {
  selectedLineDetailId = lineId;
  let lineData = cachedLiveMapData.find(l => l.id === lineId);
  if (!lineData) {
    const parentOvg = cachedLiveMapData.find(l => l.id === "london-overground");
    lineData = {
      id: lineId,
      name: (LINE_COLORS[lineId]?.name) || (lineId.charAt(0).toUpperCase() + lineId.slice(1) + " Line"),
      lineStatuses: parentOvg ? parentOvg.lineStatuses : [{ statusSeverityDescription: "Good Service" }]
    };
  }

  const results = document.getElementById("results");
  document.getElementById("toolbar").style.display = "none";

  results.innerHTML = `
    <button class="btn-back" onclick="closeLineDetailView()">← Back to Live Status</button>
    ${cardLive(lineData, true)}
  `;
}

function closeLineDetailView() {
  selectedLineDetailId = null;
  document.getElementById("toolbar").style.display = "flex";
  loadStatus();
}

function cardLive(line, forceOpenMap = false) {
  const statusObj = line.lineStatuses?.[0];
  if (!statusObj) return "";

  const mainClassify = classify(statusObj.statusSeverityDescription);
  const { stationStatuses, summaryBanners } = evaluateStationStatuses(line.id, line.lineStatuses || []);
  const styleConf = LINE_COLORS[line.id] || { var: "var(--color-default)", text: "#fff" };
  const description = statusObj.reason || statusObj.disruption?.description || "";
  const upcomingWork = getUpcomingWorkNotice(line.id);

  let upcomingWorkBannerHtml = "";
  if (upcomingWork) {
    const fromDate = new Date(upcomingWork.startDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const toDate = new Date(upcomingWork.endDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

    upcomingWorkBannerHtml = `
      <details class="upcoming-works-details">
        <summary style="font-weight: 800; font-size: 13px; color: var(--status-planned); display: flex; justify-content: space-between; align-items: center; cursor: pointer;">
          <span>🚧 Upcoming Works Notice</span>
          <span style="font-size: 12px; opacity: 0.9; margin-left: 8px;">📅 ${escapeHtml(fromDate)} — ${escapeHtml(toDate)}</span>
        </summary>
        <div style="font-size: 13px; font-weight: 600; color: var(--text-color); line-height: 1.4; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(217, 119, 6, 0.2);">
          ${escapeHtml(upcomingWork.desc)}
        </div>
      </details>
    `;
  }

  if (mainClassify.type === "good" && !forceOpenMap) {
    return `<article class="card good" style="--line-color: ${styleConf.var}; --badge-text: ${styleConf.text};">
      <div class="top">
        <div class="line-header">
          <span class="line-badge">${escapeHtml(line.name)}</span>
          ${upcomingWork ? `<span class="planned-tag">🚧 Upcoming Works</span>` : ''}
        </div>
        <div class="status good">Good service</div>
      </div>
    </article>`;
  }

  const bannersHtml = summaryBanners.map(b => 
    `<div class="segment-summary ${b.type}">⚠️ ${escapeHtml(b.text)}</div>`
  ).join("");

  const treeSvgDiagram = renderSVGTreeDiagram(line.id, stationStatuses);

  const routeVisualization = `
    <details class="map-details" ${forceOpenMap ? 'open' : ''}>
      <summary>🗺️ ${forceOpenMap ? 'Branch Route Map' : 'Show map'}</summary>
      ${treeSvgDiagram}
    </details>
  `;

  return `<article class="card" style="--line-color: ${styleConf.var}; --badge-text: ${styleConf.text};">
    <div class="top">
      <div class="line-header">
        <span class="line-badge">${escapeHtml(line.name)}</span>
        ${upcomingWork ? `<span class="planned-tag">🚧 Upcoming Works</span>` : ''}
      </div>
      <div class="status ${mainClassify.type}">${escapeHtml(mainClassify.label)}</div>
    </div>
    <div class="details">
      ${upcomingWorkBannerHtml}
      ${bannersHtml}
      ${routeVisualization}
      ${description ? `
        <details class="raw-details">
          <summary>Show TfL's original description</summary>
          <div class="raw">${escapeHtml(description)}</div>
        </details>` : ""}
    </div>
  </article>`;
}

function loadUpcomingWorks() {
  const results = document.getElementById("results");

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const activeWorks = PLANNED_SCHEDULE.filter(item => {
    const end = new Date(item.endDate);
    end.setHours(23, 59, 59, 999);
    return end >= today;
  });

  if (activeWorks.length === 0) {
    results.innerHTML = `<div class="message">✓ No major planned engineering works scheduled.</div>`;
    return;
  }

  activeWorks.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));

  let html = `<div style="font-weight: 800; font-size: 16px; margin-bottom: 14px; color: var(--text-color);">🚧 Planned Track Closures Schedule</div>`;

  activeWorks.forEach(item => {
    const conf = LINE_COLORS[item.line] || { var: "var(--color-default)", text: "#fff", name: item.line.toUpperCase() };
    const fromDate = new Date(item.startDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const toDate = new Date(item.endDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

    const horizontalMapSvg = renderHorizontalWorksMap(item.line, item.desc);

    html += `
      <div class="works-card">
        <div class="works-header">
          <span class="line-badge" style="background:${conf.hex}; color:${conf.text};">${escapeHtml(conf.name)}</span>
          <span class="works-date">📅 ${escapeHtml(fromDate)} — ${escapeHtml(toDate)}</span>
        </div>
        
        <details class="works-more-details">
          <summary>More details</summary>
          <div style="font-size: 13px; line-height: 1.4; color: var(--text-color); margin-top: 8px;">
            ${escapeHtml(item.desc)}
          </div>
          ${horizontalMapSvg}
        </details>
      </div>
    `;
  });

  results.innerHTML = html;
  lastUpdatedTime = new Date();
  updateRelativeTime();
}

function renderNetworkMap(data) {
  const results = document.getElementById("results");

  const overgroundLines = [
    { id: "mildmay", name: "Mildmay Line" },
    { id: "windrush", name: "Windrush Line" },
    { id: "weaver", name: "Weaver Line" },
    { id: "suffragette", name: "Suffragette Line" },
    { id: "lioness", name: "Lioness Line" },
    { id: "liberty", name: "Liberty Line" }
  ];

  const modeGroups = {
    tube: { title: "London Underground & Rail Lines", lines: [] },
    overground: { title: "London Overground Lines", lines: [] }
  };

  data.forEach(line => {
    const isOverground = line.id === "london-overground" || 
                         line.modeName === "overground" || 
                         line.id.includes("overground");

    if (!isOverground) {
      modeGroups.tube.lines.push(line);
    }
  });

  const overgroundParentStatus = data.find(l => l.id === "london-overground") || { lineStatuses: [{ statusSeverityDescription: "Good Service" }] };

  overgroundLines.forEach(ovg => {
    modeGroups.overground.lines.push({
      id: ovg.id,
      name: ovg.name,
      lineStatuses: overgroundParentStatus.lineStatuses
    });
  });

  let html = `<div class="network-container"><div class="network-title">Interactive Network Overview</div>`;

  Object.values(modeGroups).forEach(group => {
    if (group.lines.length === 0) return;

    html += `<div class="network-section-heading">${escapeHtml(group.title)}</div>`;
    html += `<div class="network-grid">`;

    group.lines.forEach(line => {
      const statusObj = line.lineStatuses?.[0];
      const mainClassify = classify(statusObj?.statusSeverityDescription);
      const styleConf = LINE_COLORS[line.id] || { var: "var(--color-default)", text: "#fff" };
      const hasDisruption = mainClassify.type !== "good";
      const upcomingWork = getUpcomingWorkNotice(line.id);

      let summaryLabel = "✓ Normal service →";
      if (hasDisruption) {
        summaryLabel = `⚠️ ${mainClassify.label} →`;
      }

      html += `
        <div class="network-card ${hasDisruption ? 'has-disruption' : ''}" style="--line-color: ${styleConf.var}" onclick="openLineDetailView('${line.id}')">
          <div class="line-header" style="margin-bottom: 8px;">
            <span class="line-badge">${escapeHtml(line.name)}</span>
            ${upcomingWork ? `<span class="planned-tag">🚧 Upcoming Works</span>` : ''}
          </div>
          <div class="status ${mainClassify.type}" style="font-size: 13px; text-align: left; margin-bottom: 4px;">${escapeHtml(mainClassify.label)}</div>
          <div style="font-size: 12px; color: ${hasDisruption ? 'var(--status-closed)' : 'var(--status-good)'}; font-weight: 700;">
            ${escapeHtml(summaryLabel)}
          </div>
        </div>
      `;
    });

    html += `</div>`;
  });

  html += `</div>`;
  results.innerHTML = html;
}

function updateRelativeTime() {
  if (!lastUpdatedTime) return;
  const elapsedSecs = Math.floor((new Date() - lastUpdatedTime) / 1000);
  const updatedElem = document.getElementById("updated");

  if (elapsedSecs < 10) {
    updatedElem.textContent = "Updated just now";
  } else if (elapsedSecs < 60) {
    updatedElem.textContent = `Updated ${elapsedSecs}s ago`;
  } else {
    const mins = Math.floor(elapsedSecs / 60);
    updatedElem.textContent = `Updated ${mins}m ago`;
  }
}

async function loadStatus() {
  if (selectedLineDetailId) return;

  const results = document.getElementById("results");
  results.innerHTML = `<div class="message">Loading information…</div>`;

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);

    const response = await fetch(API_LIVE, { signal: controller.signal });
    clearTimeout(timeoutId);

    if (!response.ok) {
      throw new Error(`TfL Server returned HTTP ${response.status} (${response.statusText})`);
    }

    let data = await response.json();
    cachedLiveMapData = data;

    if (currentTab === "map") {
      renderNetworkMap(data);
    }

    lastUpdatedTime = new Date();
    updateRelativeTime();
  } catch (error) {
    console.error("Diagnostic Log:", error);
    
    let cause = error.message;
    if (error.name === 'AbortError') {
      cause = "Request timed out after 10 seconds. TfL API may be responding slowly.";
    } else if (window.location.protocol === 'file:') {
      cause = "Local file restriction detected (file://). Please view via a local server or web host like GitHub Pages.";
    }

    results.innerHTML = `
      <div class="message">
        <strong>Couldn't load information.</strong>
        <p style="margin-top: 8px; font-size: 13px; color: var(--status-closed);">${cause}</p>
      </div>`;
    document.getElementById("updated").textContent = "Unable to update";
  }
}

document.getElementById("tab-map").addEventListener("click", (e) => {
  currentTab = "map";
  selectedLineDetailId = null;
  setActiveTab(e.target);
  loadStatus();
});

document.getElementById("tab-works").addEventListener("click", (e) => {
  currentTab = "works";
  selectedLineDetailId = null;
  setActiveTab(e.target);
  loadUpcomingWorks();
});

function setActiveTab(target) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  target.classList.add('active');
}

document.getElementById("btn-refresh").addEventListener("click", () => {
  if (currentTab === "works") {
    loadUpcomingWorks();
  } else {
    loadStatus();
  }
});

loadStatus();
setInterval(loadStatus, 60_000);
setInterval(updateRelativeTime, 10_000);
</script>
</body>
</html>
