<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>TfL Status Simplified</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111;
      background: #f2f2f2;
      
      /* TfL Official Line Colors */
      --color-bakerloo: #B16300;
      --color-central: #E32017;
      --color-circle: #FFD300;
      --color-district: #00782A;
      --color-hammersmith-city: #F589A6;
      --color-jubilee: #A0A5A9;
      --color-metropolitan: #9B0056;
      --color-northern: #000000;
      --color-piccadilly: #0019A8;
      --color-victoria: #0098D4;
      --color-waterloo-city: #95CDBA;
      --color-dlr: #00A4A6;
      --color-london-overground: #EE7C0E;
      --color-elizabeth: #6950A1;
      --color-tram: #84B817;
      --color-default: #555555;

      /* Status Palette */
      --status-closed: #c62828;
      --status-severe: #e65100;
      --status-minor: #f57f17;
      --status-good: #148a36;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f2f2f2; }
    header {
      background: #111;
      color: white;
      padding: calc(18px + env(safe-area-inset-top)) 18px 18px;
    }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; color: #d0d0d0; font-size: 14px; }
    
    .tab-bar {
      display: flex;
      background: #222;
      padding: 4px;
      margin-top: 14px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      background: transparent;
      color: #aaa;
      border: 0;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      text-align: center;
    }
    .tab-btn.active {
      background: #fff;
      color: #111;
    }

    main { max-width: 760px; margin: auto; padding: 16px; }
    
    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .search-input, select.select-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #fff;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
    }
    .search-input:focus, select.select-input:focus { border-color: #111; }

    .controls { display: flex; align-items: center; gap: 10px; }
    .toggle-fav {
      font-size: 13px; font-weight: 600; cursor: pointer; user-select: none;
      display: flex; align-items: center; gap: 6px;
    }
    #updated { color: #666; font-size: 13px; }
    
    button.btn-refresh {
      border: 0; border-radius: 8px; padding: 8px 14px;
      font-weight: 700; cursor: pointer; background: #111; color: white;
      font-size: 13px; display: inline-flex; align-items: center; gap: 6px;
      transition: background 0.2s ease;
    }
    button.btn-refresh:hover { background: #333; }

    button.btn-back {
      border: 1px solid #ccc; border-radius: 8px; padding: 8px 14px;
      font-weight: 700; cursor: pointer; background: #fff; color: #111;
      font-size: 13px; margin-bottom: 14px; display: inline-flex; align-items: center; gap: 6px;
    }

    .card {
      background: white; border-radius: 12px; margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden;
      border-left: 8px solid var(--line-color, var(--color-default));
    }
    .top {
      padding: 14px 15px; display: flex; justify-content: space-between;
      gap: 12px; align-items: center;
    }
    .line-header { display: flex; align-items: center; gap: 10px; }
    
    .line-badge {
      background: var(--line-color, var(--color-default));
      color: var(--badge-text, #fff);
      font-size: 14px; font-weight: 800;
      padding: 5px 12px; border-radius: 6px;
      display: inline-block;
    }
    .fav-star {
      cursor: pointer; font-size: 18px; color: #ccc;
      user-select: none; transition: color 0.15s ease;
    }
    .fav-star.active { color: #f5a623; }

    .status { font-size: 14px; font-weight: 800; text-align: right; }
    .status.good { color: var(--status-good); }
    .status.closed { color: var(--status-closed); }
    .status.severe { color: var(--status-severe); }
    .status.minor { color: var(--status-minor); }
    
    .details { padding: 0 15px 15px; border-top: 1px solid #f0f0f0; }

    .segment-summary {
      font-size: 13px; font-weight: 700;
      padding: 8px 12px; border-radius: 0 6px 6px 0; margin-top: 12px;
    }
    .segment-summary.closed { background: #fdf3f2; border-left: 3px solid var(--status-closed); color: var(--status-closed); }
    .segment-summary.severe { background: #fff3e0; border-left: 3px solid var(--status-severe); color: var(--status-severe); }
    .segment-summary.minor { background: #fffde7; border-left: 3px solid var(--status-minor); color: #827717; }

    .line-diagram { display: flex; flex-direction: column; margin: 14px 0 10px 8px; }
    .diagram-node { display: flex; align-items: center; gap: 12px; position: relative; padding: 7px 0; }
    
    .diagram-node::before {
      content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
      width: 4px; background: var(--line-color, var(--color-default)); opacity: 0.3; z-index: 1;
    }
    .diagram-node:first-child::before { top: 50%; }
    .diagram-node:last-child::before { bottom: 50%; }
    
    .diagram-node.track-closed::before { background: var(--status-closed) !important; opacity: 1 !important; width: 6px !important; left: 6px !important; }
    .diagram-node.track-severe::before { background: var(--status-severe) !important; opacity: 1 !important; width: 6px !important; left: 6px !important; }
    .diagram-node.track-minor::before { background: var(--status-minor) !important; opacity: 1 !important; width: 6px !important; left: 6px !important; }
    
    .dot {
      width: 18px; height: 18px; border-radius: 50%; background: white;
      border: 4px solid var(--line-color, var(--color-default)); z-index: 2; flex-shrink: 0;
    }
    .diagram-node.dot-closed .dot { background: var(--status-closed); border-color: var(--status-closed); transform: scale(1.15); }
    .diagram-node.dot-severe .dot { background: var(--status-severe); border-color: var(--status-severe); transform: scale(1.1); }
    .diagram-node.dot-minor .dot { background: var(--status-minor); border-color: var(--status-minor); }
    
    .node-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .node-name { font-size: 13px; color: #666; }
    .diagram-node.dot-closed .node-name { color: var(--status-closed); font-weight: 800; }
    .diagram-node.dot-severe .node-name { color: var(--status-severe); font-weight: 800; }
    .diagram-node.dot-minor .node-name { color: #827717; font-weight: 700; }
    
    .status-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; color: white; padding: 2px 6px; border-radius: 4px; }
    .status-tag.closed { background: var(--status-closed); }
    .status-tag.severe { background: var(--status-severe); }
    .status-tag.minor { background: var(--status-minor); }

    .timetable-group-title {

      border-radius: 8px 8px 0 0; display: flex; justify-content: space-between; align-items: center;

    .timetable-item {

    .train-plat { font-size: 12px; color: #666; margin-top: 2px; }
    .train-time {

    .network-title { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
    .network-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .network-card {

    .raw { background: #f5f5f5; padding: 10px; margin-top: 8px; font-size: 13px; line-height: 1.4; border-radius: 6px; }
    .message { background: white; padding: 18px; border-radius: 12px; text-align: center; color: #555; }
  </style>

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value || "";
  return div.innerHTML;
}

function cleanStationName(str) {
  return str.toLowerCase().replace(/\s*(station|underground station|rail station|line)\s*/gi, '').trim();
}

function toggleFavorite(lineId) {
  if (favoriteLines.has(lineId)) {
    favoriteLines.delete(lineId);
  } else {
    favoriteLines.add(lineId);
  }
  localStorage.setItem("tfl_fav_lines", JSON.stringify(Array.from(favoriteLines)));
  loadStatus();
}

function classify(statusText) {
  const lower = (statusText || "").toLowerCase();
  if (lower.includes("good")) return { type: "good", label: "Good service" };
  if (lower.includes("no service") || lower.includes("suspended") || lower.includes("part closure") || lower.includes("closure")) return { type: "closed", label: statusText };
  if (lower.includes("severe")) return { type: "severe", label: statusText };
  if (lower.includes("minor") || lower.includes("delays") || lower.includes("reduced")) return { type: "minor", label: statusText };
  return { type: "minor", label: statusText || "Unknown" };
}

// INTELLIGENT DISruption EVALUATOR
function analyzeRouteStatus(lineId, statusObj) {
  const route = LINE_ROUTES[lineId] || [];
  const stationStatuses = new Map();
  const summaryBanners = [];

  function addBanner(type, text) {
    if (!summaryBanners.some(b => b.text === text)) {
      summaryBanners.push({ type, text });
    }
  }

  const lineStatuses = statusObj?.lineStatuses || [];

  lineStatuses.forEach(status => {
    const mainSeverity = classify(status.statusSeverityDescription);
    const reason = status.reason || status.disruption?.description || "";
    const lowerReason = reason.toLowerCase();

    // 1. Check for specific closed boundaries ("between A and B")
    const closedRegex = /(?:no service|suspended|part closure|closed|part suspended)\s+(?:between|from)\s+([a-z0-9\s&'-]+?)\s+(?:and|to)\s+([a-z0-9\s&'-]+?)(?=\s+due|\s+while|\s+and|\.|$)/gi;
    let match;
    let foundRange = false;

    while ((match = closedRegex.exec(lowerReason)) !== null) {
      const startStr = cleanStationName(match[1]);
      const endStr = cleanStationName(match[2]);

      const idxA = route.findIndex(s => {
        const cs = cleanStationName(s);
        return startStr.includes(cs) || cs.includes(startStr);
      });
      const idxB = route.findIndex(s => {
        const cs = cleanStationName(s);
        return endStr.includes(cs) || cs.includes(endStr);
      });

      if (idxA !== -1 && idxB !== -1) {
        foundRange = true;
        const start = Math.min(idxA, idxB);
        const end = Math.max(idxA, idxB);
        for (let i = start; i <= end; i++) {
          stationStatuses.set(i, "closed");
        }
        addBanner("closed", `No service between ${route[start]} and ${route[end]}`);
      }
    }

    // 2. Entire line closure / suspension fallback
    if (mainSeverity.type === "closed" && !foundRange) {
      route.forEach((_, idx) => stationStatuses.set(idx, "closed"));
      addBanner("closed", "No service on line");
    }

    // 3. Severe / Minor Delays across rest of line
    if (lowerReason.includes("severe delays") || (mainSeverity.type === "severe" && stationStatuses.size === 0)) {
      route.forEach((_, idx) => {
        if (!stationStatuses.has(idx)) {
          stationStatuses.set(idx, "severe");
        }
      });
      addBanner("severe", stationStatuses.size === route.length ? "Severe delays across entire line" : "Severe delays on rest of the line");
    } else if (lowerReason.includes("minor delays") || (mainSeverity.type === "minor" && stationStatuses.size === 0)) {
      route.forEach((_, idx) => {
        if (!stationStatuses.has(idx)) {
          stationStatuses.set(idx, "minor");
        }
      });
      addBanner("minor", stationStatuses.size === route.length ? "Minor delays across entire line" : "Minor delays on rest of the line");
    }
  });

  return { route, stationStatuses, summaryBanners };
}

function buildDiagramHtml(route, stationStatuses) {
  return `<div class="line-diagram">` + 
    route.map((station, i) => {
      const statusType = stationStatuses.get(i);
      const nextStatusType = stationStatuses.get(i + 1);

      let dotClass = "";
      let trackClass = "";
      let tagHtml = "";

      if (statusType === "closed") {
        dotClass = "dot-closed";
        tagHtml = `<span class="status-tag closed">Closed / No Service</span>`;
      } else if (statusType === "severe") {
        dotClass = "dot-severe";
        tagHtml = `<span class="status-tag severe">Severe Delays</span>`;
      } else if (statusType === "minor") {
        dotClass = "dot-minor";
        tagHtml = `<span class="status-tag minor">Minor Delays</span>`;
      }

      if (statusType && nextStatusType) {
        if (statusType === "closed" && nextStatusType === "closed") trackClass = "track-closed";
        else if (statusType === "severe" || nextStatusType === "severe") trackClass = "track-severe";
        else if (statusType === "minor" || nextStatusType === "minor") trackClass = "track-minor";
      }

      return `
        <div class="diagram-node ${dotClass} ${trackClass}">
          <div class="dot"></div>
          <div class="node-info">
            <span class="node-name">${escapeHtml(station)}</span>
            ${tagHtml}
          </div>
        </div>
      `;
    }).join('') +
  `</div>`;
}

function cardLive(line, forceOpenMap = false) {
  const statusObj = line.lineStatuses?.[0];
  if (!statusObj) return "";

  const mainClassify = classify(statusObj.statusSeverityDescription);
  const { route, stationStatuses, summaryBanners } = analyzeRouteStatus(line.id, line);
  const styleConf = LINE_COLORS[line.id] || { var: "var(--color-default)", text: "#fff" };
  const isFav = favoriteLines.has(line.id);
  const description = statusObj.reason || statusObj.disruption?.description || "";

  if (mainClassify.type === "good" && !forceOpenMap) {
    return `<article class="card good" style="--line-color: ${styleConf.var}; --badge-text: ${styleConf.text};">
      <div class="top">
        <div class="line-header">
          <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFavorite('${line.id}')">★</span>
          <span class="line-badge">${escapeHtml(line.name)}</span>
        </div>
        <div class="status good">Good service</div>
      </div>
    </article>`;
  }

  const bannersHtml = summaryBanners.map(b => 
    `<div class="segment-summary ${b.type}">⚠️ ${escapeHtml(b.text)}</div>`
  ).join("");

  let routeVisualization = "";
  if (route.length > 0) {
    routeVisualization = `
      <details class="map-details" ${forceOpenMap ? 'open' : ''}>
        <summary>🗺️ ${forceOpenMap ? 'Visual Route Map' : `Show visual map (${stationStatuses.size} station(s) affected)`}</summary>
        ${buildDiagramHtml(route, stationStatuses)}
      </details>
    `;
  }

  return `<article class="card" style="--line-color: ${styleConf.var}; --badge-text: ${styleConf.text};">
    <div class="top">
      <div class="line-header">
        <span class="fav-star ${isFav ? 'active' : ''}" onclick="toggleFavorite('${line.id}')">★</span>
        <span class="line-badge">${escapeHtml(line.name)}</span>
      </div>
      <div class="status ${mainClassify.type}">${escapeHtml(mainClassify.label)}</div>
    </div>
    <div class="details">
      ${bannersHtml}
      ${routeVisualization}
      ${description ? `
        <details class="raw-details">
          <summary>Show TfL's original description</summary>
          <div class="raw">${escapeHtml(description)}</div>
        </details>` : ""}
    </div>
  </article>`;
}

async function loadLiveTimetable(stopPointId) {
  const results = document.getElementById("results");
  if (!stopPointId) {
    results.innerHTML = `<div class="message">Please select a station from the dropdown above.</div>`;
    return;
  }

  results.innerHTML = `<div class="message">Fetching live train arrivals…</div>`;

  try {
    const url = `https://api.tfl.gov.uk/StopPoint/${stopPointId}/Arrivals`;
    const response = await fetch(url);
    if (!response.ok) throw new Error("HTTP " + response.status);
    const arrivals = await response.json();

    if (!arrivals || arrivals.length === 0) {
      results.innerHTML = `<div class="message">No live departures found for this station right now.</div>`;
      return;
    }

    arrivals.sort((a, b) => a.timeToStation - b.timeToStation);

    const grouped = {};
    arrivals.forEach(train => {
      const lineKey = train.lineName || "Service";
      const dirKey = train.platformName || train.destinationName || "Departures";
      const groupKey = `${lineKey} — ${dirKey}`;

      if (!grouped[groupKey]) grouped[groupKey] = [];
      grouped[groupKey].push(train);
    });

    let html = "";
    for (const [title, trains] of Object.entries(grouped)) {
      html += `<div class="timetable-group">
        <div class="timetable-group-title">
          <span>🚇 ${escapeHtml(title)}</span>
        </div>`;

      trains.slice(0, 3).forEach(t => {
        const mins = Math.floor(t.timeToStation / 60);
        const timeStr = mins <= 0 ? "Due" : `${mins} mins`;
        html += `
          <div class="timetable-item">
            <div>
              <div class="train-dest">To ${escapeHtml(t.destinationName || "Destination")}</div>
              <div class="train-plat">${escapeHtml(t.currentLocation || "In transit")}</div>
            </div>
            <div class="train-time">${escapeHtml(timeStr)}</div>
          </div>
        `;
      });

      html += `</div>`;
    }

    results.innerHTML = html;
    lastUpdatedTime = new Date();
    updateRelativeTime();
  } catch (err) {
    console.error(err);
    results.innerHTML = `<div class="message"><strong>Could not load arrivals.</strong><p>Please try another station.</p></div>`;
  }
}

function openLineDetailView(lineId) {
  selectedLineDetailId = lineId;
  const lineData = cachedLiveMapData.find(l => l.id === lineId);
  const results = document.getElementById("results");
  document.getElementById("toolbar").style.display = "none";

  if (!lineData) {
    results.innerHTML = `<button class="btn-back" onclick="closeLineDetailView()">← Back to Network Map</button><div class="message">Line details not found.</div>`;
    return;
  }

  results.innerHTML = `
    <button class="btn-back" onclick="closeLineDetailView()">← Back to Network Map</button>
    ${cardLive(lineData, true)}
  `;
}

function closeLineDetailView() {
  selectedLineDetailId = null;
  document.getElementById("toolbar").style.display = "flex";
  loadStatus();
}

function renderNetworkMap(data) {
  const results = document.getElementById("results");
  
  const cardsHtml = data.map(line => {
    const statusObj = line.lineStatuses?.[0];
    const mainClassify = classify(statusObj?.statusSeverityDescription);
    const { route, stationStatuses } = analyzeRouteStatus(line.id, line);
    const styleConf = LINE_COLORS[line.id] || { var: "var(--color-default)", text: "#fff" };
    const hasDisruption = mainClassify.type !== "good";

    let summaryLabel = "✓ Normal service →";
    if (hasDisruption) {
      if (stationStatuses.size >= route.length && route.length > 0) {
        summaryLabel = "⚠️ Entire line affected →";
      } else {
        summaryLabel = `⚠️ Part of line affected (${stationStatuses.size} stations) →`;
      }
    }

    return `
      <div class="network-card ${hasDisruption ? 'has-disruption' : ''}" style="--line-color: ${styleConf.var}" onclick="openLineDetailView('${line.id}')">
        <div class="line-header" style="margin-bottom: 8px;">
          <span class="line-badge">${escapeHtml(line.name)}</span>
          <span class="status ${mainClassify.type}" style="font-size: 13px;">${escapeHtml(mainClassify.label)}</span>
        </div>
        <div style="font-size: 12px; color: ${hasDisruption ? 'var(--status-closed)' : 'var(--status-good)'}; font-weight: 700;">
          ${escapeHtml(summaryLabel)}
        </div>
      </div>
    `;
  }).join('');

  results.innerHTML = `
    <div class="network-container">
      <div class="network-title">Interactive TfL Network Overview</div>
      <p style="font-size: 13px; color: #666; margin-top: -6px; margin-bottom: 14px;">Tap any line below to view its color-coded visual route map.</p>
      <div class="network-grid">${cardsHtml}</div>
    </div>
  `;
}

function updateRelativeTime() {
  if (!lastUpdatedTime) return;
  const elapsedSecs = Math.floor((new Date() - lastUpdatedTime) / 1000);
  const updatedElem = document.getElementById("updated");

  if (elapsedSecs < 10) {
    updatedElem.textContent = "Updated just now";
  } else if (elapsedSecs < 60) {
    updatedElem.textContent = `Updated ${elapsedSecs}s ago`;
  } else {
    const mins = Math.floor(elapsedSecs / 60);
    updatedElem.textContent = `Updated ${mins}m ago`;
  }
}

async function loadStatus() {
  if (selectedLineDetailId) return;

  const results = document.getElementById("results");
  const searchQuery = document.getElementById("search-bar").value.toLowerCase().trim();
  const filterFavs = document.getElementById("filter-favs").checked;

  results.innerHTML = `<div class="message">Loading information…</div>`;

  try {
    const response = await fetch(API_LIVE);
    if (!response.ok) throw new Error("HTTP " + response.status);
    let data = await response.json();
    cachedLiveMapData = data;

    if (currentTab === "map") {
      renderNetworkMap(data);
    } else {
      if (filterFavs) {
        data = data.filter(line => favoriteLines.has(line.id));
      }

      if (searchQuery) {
        data = data.filter(line => {
          const nameMatch = line.name.toLowerCase().includes(searchQuery);
          const descMatch = (line.lineStatuses?.[0]?.reason || "").toLowerCase().includes(searchQuery);
          const routeMatch = (LINE_ROUTES[line.id] || []).some(s => s.toLowerCase().includes(searchQuery));
          return nameMatch || descMatch || routeMatch;
        });
      }

      data.sort((a, b) => {
        const aFav = favoriteLines.has(a.id) ? 1 : 0;
        const bFav = favoriteLines.has(b.id) ? 1 : 0;
        if (aFav !== bFav) return bFav - aFav;

        const ag = (a.lineStatuses?.[0]?.statusSeverityDescription || "").toLowerCase().includes("good");
        const bg = (b.lineStatuses?.[0]?.statusSeverityDescription || "").toLowerCase().includes("good");
        return Number(ag) - Number(bg);
      });

      if (data.length === 0) {
        results.innerHTML = `<div class="message">No matching lines or stations found.</div>`;
      } else {
        results.innerHTML = data.map(line => cardLive(line)).join("");
      }
    }

    lastUpdatedTime = new Date();
    updateRelativeTime();
  } catch (error) {
    console.error(error);
    results.innerHTML = `
      <div class="message">
        <strong>Couldn't load information.</strong>
        <p>Check your internet connection and try again.</p>
      </div>`;
    document.getElementById("updated").textContent = "Unable to update";
  }
}

document.getElementById("tab-live").addEventListener("click", (e) => {
  currentTab = "live";
  selectedLineDetailId = null;
  setActiveTab(e.target);
  document.getElementById("search-bar").style.display = "block";
  document.getElementById("station-select").style.display = "none";
  document.getElementById("fav-label").style.display = "flex";
  loadStatus();
});

document.getElementById("tab-map").addEventListener("click", (e) => {
  currentTab = "map";
  selectedLineDetailId = null;
  setActiveTab(e.target);
  document.getElementById("search-bar").style.display = "block";
  document.getElementById("station-select").style.display = "none";
  document.getElementById("fav-label").style.display = "none";
  loadStatus();
});

document.getElementById("tab-timetable").addEventListener("click", (e) => {
  currentTab = "timetable";
  selectedLineDetailId = null;
  setActiveTab(e.target);
  document.getElementById("search-bar").style.display = "none";
  document.getElementById("station-select").style.display = "block";
  document.getElementById("fav-label").style.display = "none";
  
  const selectedStation = document.getElementById("station-select").value;
  if (selectedStation) {
    loadLiveTimetable(selectedStation);
  } else {
    document.getElementById("results").innerHTML = `<div class="message">Please select a station above to view live train departures.</div>`;
  }
});

function setActiveTab(target) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  target.classList.add('active');
}

document.getElementById("station-select").addEventListener("change", (e) => {
  if (currentTab === "timetable") {
    loadLiveTimetable(e.target.value);
  }
});

document.getElementById("btn-refresh").addEventListener("click", () => {
  if (currentTab === "timetable") {
    const selectedStation = document.getElementById("station-select").value;
    loadLiveTimetable(selectedStation);
  } else {
    loadStatus();
  }
});

document.getElementById("search-bar").addEventListener("input", loadStatus);
document.getElementById("filter-favs").addEventListener("change", loadStatus);

loadStatus();
setInterval(loadStatus, 60_000);
setInterval(updateRelativeTime, 10_000);
</script>
</body>
</html>
