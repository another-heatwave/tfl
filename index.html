<script>
function escapeHtml(val) { const d = document.createElement("div"); d.textContent = val || ""; return d.innerHTML; }
function cleanStationName(s) {
  return (s || "").toLowerCase().replace(/\b(underground|rail|dlr|overground|tram|elizabeth line)\s+station\b/gi, '').replace(/\bstation\b/gi, '').replace(/\s*\(.*?\)\s*/g, ' ').replace(/[.'’]/g, '').replace(/\bst\b/g, 'st').replace(/\s+/g, ' ').trim();
}
function classify(text) {
  const l = (text || "").toLowerCase();
  if(l.includes("good")) return { type: "good", label: "Good service" };
  if(l.includes("planned") || l.includes("work")) return { type: "planned", label: text };
  if(l.includes("no service") || l.includes("suspended") || l.includes("closure")) return { type: "closed", label: text };
  if(l.includes("severe")) return { type: "severe", label: text };
  if(l.includes("minor") || l.includes("delays") || l.includes("reduced")) return { type: "minor", label: text };
  return { type: "minor", label: text || "Unknown" };
}

const API_LIVE = "https://api.tfl.gov.uk/Line/Mode/tube,dlr,elizabeth-line,overground,tram/Status?detail=true";

const darkModeToggle = document.getElementById("dark-mode-toggle");
darkModeToggle.checked = document.documentElement.classList.contains("dark-mode");
darkModeToggle.addEventListener("change", (e) => {
  if (e.target.checked) { document.documentElement.classList.add("dark-mode"); localStorage.setItem("tfl_dark_mode", "true"); }
  else { document.documentElement.classList.remove("dark-mode"); localStorage.setItem("tfl_dark_mode", "false"); }
});

function getDynamicPlannedSchedule() {
  const base = new Date();
  const fmt = (offsetDays) => {
    const d = new Date(base); d.setDate(d.getDate() + offsetDays); return d.toISOString().split('T')[0];
  };
  return [
    { line: "district", startDate: fmt(3), endDate: fmt(4), desc: "No service between Turnham Green and Richmond; and between Earl's Court and Kensington (Olympia)." },
    { line: "central", startDate: fmt(3), endDate: fmt(4), desc: "No service between Leytonstone and Woodford via Hainault." },
    { line: "circle", startDate: fmt(3), endDate: fmt(3), desc: "No service between Edgware Road and Aldgate via Victoria until 14:00." },
    { line: "piccadilly", startDate: fmt(5), endDate: fmt(6), desc: "No service between Acton Town and Uxbridge." },
    { line: "northern", startDate: fmt(10), endDate: fmt(11), desc: "No service between Camden Town and High Barnet / Mill Hill East." },
    { line: "elizabeth", startDate: fmt(3), endDate: fmt(3), desc: "Reduced service between West Drayton and Maidenhead; trains will not stop at Acton Main Line, Hanwell and West Ealing." },
    { line: "mildmay", startDate: fmt(3), endDate: fmt(4), desc: "No service between Willesden Junction and Richmond." },
    { line: "windrush", startDate: fmt(3), endDate: fmt(4), desc: "No service between Surrey Quays and Clapham Junction; and between New Cross Gate and Crystal Palace / West Croydon." },
    { line: "weaver", startDate: fmt(5), endDate: fmt(7), desc: "No service between Hackney Downs and Chingford after 22:45." },
    { line: "dlr", startDate: fmt(10), endDate: fmt(11), desc: "No service between Canning Town and Beckton." },
    { line: "tram", startDate: fmt(2), endDate: fmt(8), desc: "No service between Reeves Corner and East Croydon." }
  ];
}
const PLANNED_SCHEDULE = getDynamicPlannedSchedule();

function getUpcomingWorkNotice(lineId) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const nextWeek = new Date(today); nextWeek.setDate(today.getDate() + 7);
  return PLANNED_SCHEDULE.find(item => {
    if(item.line !== lineId) return false;
    const start = new Date(item.startDate);
    const end = new Date(item.endDate); end.setHours(23, 59, 59, 999);
    return today <= end && start <= nextWeek;
  });
}

const INTERCHANGE_DIRECTORY = {
  "Ealing Broadway": ["central", "district", "elizabeth", "national-rail"], "Ealing Common": ["district", "piccadilly"],

  const graph = LINE_GRAPHS[lineId]; if (!graph) return [];
  const segments = [];
  graph.columns.forEach(colObj => { colObj.segments.forEach(seg => { const list = Array.isArray(seg) ? seg : seg.stations; if (list && list.length) segments.push(list); }); });
  return segments;
}

}

      let matchedInSeg = false;
      segments.forEach(seg => {
        const idxA = seg.findIndex(s => matchSt(s, startStr)), idxB = seg.findIndex(s => matchSt(s, endStr));
        if (idxA !== -1 && idxB !== -1) {
          matchedInSeg = true; foundRange = true;
          const sIdx = Math.min(idxA, idxB), eIdx = Math.max(idxA, idxB);
          for (let i = sIdx; i <= eIdx; i++) stationStatuses.set(seg[i], severityType);
          addBanner(severityType, `${isPlannedWork ? 'Planned Works' : mainSeverity.label}: ${seg[sIdx]} to ${seg[eIdx]}`);
        }
      });
      if (!matchedInSeg) {
        const stA = allStations.find(s => matchSt(s, startStr)), stB = allStations.find(s => matchSt(s, endStr));
        if (stA && stB) {
          foundRange = true; stationStatuses.set(stA, severityType); stationStatuses.set(stB, severityType);
          segments.forEach(seg => {
            const iA = seg.indexOf(stA), iB = seg.indexOf(stB);
            if (iA !== -1 && iB === -1) for (let i = iA; i < seg.length; i++) stationStatuses.set(seg[i], severityType);
            else if (iB !== -1 && iA === -1) for (let i = 0; i <= iB; i++) stationStatuses.set(seg[i], severityType);
          });
          addBanner(severityType, `${isPlannedWork ? 'Planned Works' : mainSeverity.label}: ${stA} to ${stB}`);
        }
      }
    }
    if (mainSeverity.type === "closed" && !foundRange) {
      allStations.forEach(st => stationStatuses.set(st, severityType)); addBanner(severityType, isPlannedWork ? "Planned closure across entire line" : "No service across entire line");
    } else if (mainSeverity.type === "severe" && !foundRange) {
      allStations.forEach(st => stationStatuses.set(st, "severe")); addBanner("severe", "Severe delays across line");
    } else if (mainSeverity.type === "minor" && !foundRange) {
      allStations.forEach(st => stationStatuses.set(st, "minor")); addBanner("minor", "Minor delays across line");
    }
  });
  return { stationStatuses, summaryBanners };
}

function getInterchangeBadgesHtml(currentLineId, stationName) {
  const baseName = stationName.replace(/\s*\(.*?\)\s*/g, '').trim();
  const connectingLines = INTERCHANGE_DIRECTORY[stationName] || INTERCHANGE_DIRECTORY[baseName];
  if (!connectingLines) return "";
  const otherLines = connectingLines.filter(id => id !== currentLineId);
  if (otherLines.length === 0) return "";
  const badges = otherLines.map(id => {
    const conf = LINE_COLORS[id]; if (!conf) return "";
    if (id === "national-rail") return `<span class="ic-btn" style="background:${conf.hex}; color:${conf.text}; cursor:default;" title="National Rail">NR</span>`;
    return `<button class="ic-btn" style="background:${conf.hex}; color:${conf.text};" onclick="openLineDetailView('${id}'); event.stopPropagation();" title="Switch to ${escapeHtml(conf.name)}">${escapeHtml(conf.short)}</button>`;
  }).join("");
  return `<div class="ic-badge-container">${badges}</div>`;
}

function renderSVGTreeDiagram(lineId, stationStatuses) {
  const graph = LINE_GRAPHS[lineId]; if (!graph) return "";
  const baseColor = (LINE_COLORS[lineId] || { hex: "#EE7C0E" }).hex;
  function getStatusStyle(status) {
    if (status === "closed") return { fill: "var(--status-closed)", stroke: "var(--status-closed)", symbol: " ⛔", text: "var(--status-closed)" };
    if (status === "severe") return { fill: "var(--status-severe)", stroke: "var(--status-severe)", symbol: " 🚨", text: "var(--status-severe)" };
    if (status === "minor") return { fill: "var(--status-minor)", stroke: "var(--status-minor)", symbol: " ⚠️", text: "var(--status-minor)" };
    if (status === "planned") return { fill: "var(--status-planned)", stroke: "var(--status-planned)", symbol: " 🚧", text: "var(--status-planned)" };
    return { fill: "#ffffff", stroke: baseColor, symbol: "", text: "var(--text-color)" };
  }

  const rowHeight = 46, colSpacing = 270, startX = 28, startY = 24;
  const nodeCoords = new Map(), segmentChains = [];
  let maxRow = 0, maxCol = 0;

  graph.columns.forEach(colObj => {
    const cIdx = colObj.col; if (cIdx > maxCol) maxCol = cIdx;
    const x = startX + (cIdx * colSpacing); let currentRow = 0;
    colObj.segments.forEach(seg => {
      let stations = Array.isArray(seg) ? seg : (seg.stations || []);
      if (!Array.isArray(seg)) {
        if (typeof seg.gapRows === "number") currentRow += seg.gapRows;
        if (seg.alignWith && nodeCoords.has(seg.alignWith)) currentRow = Math.max(currentRow, Math.round((nodeCoords.get(seg.alignWith).y - startY) / rowHeight) + (seg.offsetRows || 0));
        if (seg.alignAfter && nodeCoords.has(seg.alignAfter)) currentRow = Math.max(currentRow, Math.round((nodeCoords.get(seg.alignAfter).y - startY) / rowHeight) + (seg.offsetRows || 1));
      }
      const chain = [];
      stations.forEach(st => {
        const y = startY + (currentRow * rowHeight);
        nodeCoords.set(st, { x, y, col: cIdx, row: currentRow });
        chain.push({ name: st, x, y });
        if (currentRow > maxRow) maxRow = currentRow; currentRow++;
      });
      if (chain.length > 0) segmentChains.push(chain);
    });
  });

  const svgWidth = Math.max(680, startX + ((maxCol + 1) * colSpacing) + 20), svgHeight = startY + ((maxRow + 1) * rowHeight) + 30;
  let tracksSvg = "", nodesSvg = "";

  segmentChains.forEach(chain => {
    if (chain.length > 1) {
      const first = chain[0], last = chain[chain.length - 1];
      tracksSvg += `<line x1="${first.x}" y1="${first.y}" x2="${last.x}" y2="${last.y}" stroke="${baseColor}" stroke-width="4.5" opacity="0.55" stroke-linecap="round" />`;
    }
  });

  (graph.links || []).forEach(link => {
    const fromPt = nodeCoords.get(link.from), toPt = nodeCoords.get(link.to);
    if (!fromPt || !toPt) return;
    const dash = (link.style === "dashed" || link.style === "loop") ? `stroke-dasharray="5 5"` : "";
    const op = link.style === "dashed" ? "0.85" : "0.65";
    if (fromPt.x === toPt.x) {
      tracksSvg += `<line x1="${fromPt.x}" y1="${fromPt.y}" x2="${toPt.x}" y2="${toPt.y}" stroke="${baseColor}" stroke-width="3.5" ${dash} opacity="${op}" />`;
    } else if (link.style === "loop") {
      const midY = (fromPt.y + toPt.y) / 2;
      tracksSvg += `<path d="M ${fromPt.x} ${fromPt.y} C ${fromPt.x} ${midY}, ${toPt.x} ${midY}, ${toPt.x} ${toPt.y}" stroke="${baseColor}" stroke-width="3.5" fill="none" ${dash} opacity="0.8" />`;
    } else {
      const ctrlY1 = fromPt.y + ((toPt.y - fromPt.y) * 0.55), ctrlY2 = fromPt.y + ((toPt.y - fromPt.y) * 0.45);
      tracksSvg += `<path d="M ${fromPt.x} ${fromPt.y} C ${fromPt.x} ${ctrlY1}, ${toPt.x} ${ctrlY2}, ${toPt.x} ${toPt.y}" stroke="${baseColor}" stroke-width="3.5" fill="none" ${dash} opacity="${op}" />`;
    }
  });

  nodeCoords.forEach((pt, st) => {
    const status = stationStatuses.get(st), style = getStatusStyle(status), icBadges = getInterchangeBadgesHtml(lineId, st);
    const isIc = Boolean(icBadges), safeStJs = st.replace(/\s*\(.*?\)\s*/g, '').trim().replace(/'/g, "\\'");
    nodesSvg += `<g class="st-interactive" onclick="openStationLiveModal('${safeStJs}'); event.stopPropagation();" title="Live trains at ${escapeHtml(st)}">`;
    if (isIc) {
      nodesSvg += `<circle cx="${pt.x}" cy="${pt.y}" r="8" fill="#ffffff" stroke="#111111" stroke-width="2.5" />`;
      nodesSvg += `<circle cx="${pt.x}" cy="${pt.y}" r="3.8" fill="${style.fill}" stroke="${style.stroke}" stroke-width="1.8" />`;
    } else nodesSvg += `<circle cx="${pt.x}" cy="${pt.y}" r="5.5" fill="${style.fill}" stroke="${style.stroke}" stroke-width="2.5" />`;
    nodesSvg += `<text x="${pt.x + 14}" y="${pt.y + 4}" fill="${style.text}" font-size="12.5" font-weight="${status || isIc ? '700' : '600'}">${escapeHtml(st)}${style.symbol}</text></g>`;
    if (isIc) nodesSvg += `<foreignObject x="${pt.x + 13}" y="${pt.y + 6}" width="${colSpacing - 24}" height="26">${icBadges}</foreignObject>`;
  });

  return `<div class="svg-tree-wrapper"><svg width="100%" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="xMinYMin meet">${tracksSvg}${nodesSvg}</svg></div>`;
}

function renderHorizontalWorksMap(lineId, descriptionText) {
  const baseColor = (LINE_COLORS[lineId] || { hex: "#EE7C0E" }).hex, stationList = getAllStationsForLine(lineId);
  if (stationList.length === 0) return "";
  const { stationStatuses } = evaluateStationStatuses(lineId, [{ statusSeverityDescription: "Planned Closure", reason: descriptionText }]);
  const colWidth = 42, trackY = 36, svgWidth = Math.max(stationList.length * colWidth + 60, 580), svgHeight = 155;
  let svgHtml = `<svg width="100%" height="${svgHeight}" viewBox="0 0 ${svgWidth} ${svgHeight}" preserveAspectRatio="xMinYMin meet"><line x1="30" y1="${trackY}" x2="${30 + (stationList.length - 1) * colWidth}" y2="${trackY}" stroke="${baseColor}" stroke-width="5" opacity="0.3" />`;
  stationList.forEach((st, i) => {
    const x = 30 + i * colWidth, isAffected = stationStatuses.has(st);
    if (isAffected && i < stationList.length - 1 && stationStatuses.has(stationList[i + 1])) {
      svgHtml += `<line x1="${x}" y1="${trackY}" x2="${x + colWidth}" y2="${trackY}" stroke="var(--status-planned)" stroke-width="6" />`;
    }
    const dotFill = isAffected ? "var(--status-planned)" : "#ffffff", dotStroke = isAffected ? "var(--status-planned)" : baseColor, textColor = isAffected ? "var(--status-planned)" : "var(--text-muted)";
    svgHtml += `<circle cx="${x}" cy="${trackY}" r="${isAffected ? 6 : 4.5}" fill="${dotFill}" stroke="${dotStroke}" stroke-width="2.5" />`;
    svgHtml += `<text x="${x}" y="${trackY + 15}" fill="${textColor}" font-size="10.5" font-weight="${isAffected ? '700' : '600'}" transform="rotate(45, ${x}, ${trackY + 15})" text-anchor="start">${escapeHtml(st)}${isAffected ? ' 🚧' : ''}</text>`;
  });
  return `<div class="horizontal-svg-wrapper" onclick="openZoomModal('${escapeHtml((LINE_COLORS[lineId] || {}).name || 'Map')}', this.innerHTML)">${svgHtml}</svg></div>`;
}

function getLinesServingStation(stationName) {
  const cTarget = cleanStationName(stationName), lines = new Set();
  if (INTERCHANGE_DIRECTORY[stationName]) INTERCHANGE_DIRECTORY[stationName].forEach(l => { if (l !== "national-rail") lines.add(l); });
  Object.keys(LINE_GRAPHS).forEach(lineId => { if (getAllStationsForLine(lineId).some(s => cleanStationName(s) === cTarget)) lines.add(lineId); });
  return Array.from(lines);
}

async function fetchLiveArrivalsForStation(stationName, targetId) {
  if (liveArrivalsAbortController) liveArrivalsAbortController.abort();
  liveArrivalsAbortController = new AbortController();
  const signal = liveArrivalsAbortController.signal, container = document.getElementById(targetId);
  if (!container) return;
  const servingLines = getLinesServingStation(stationName);
  if (servingLines.length === 0) return (container.innerHTML = `<div class="message">No line data for ${escapeHtml(stationName)}.</div>`);

  try {
    const res = await fetch(`https://api.tfl.gov.uk/Line/${servingLines.join(",")}/Arrivals`, { signal });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const allPredictions = await res.json(), cTarget = cleanStationName(stationName);
    const matched = allPredictions.filter(p => { const pSt = cleanStationName(p.stationName || ""); return pSt === cTarget || pSt.startsWith(cTarget) || cTarget.startsWith(pSt); });
    
    if (matched.length === 0) {
      const searchRes = await fetch(`https://api.tfl.gov.uk/StopPoint/Search/${encodeURIComponent(stationName)}?modes=tube,dlr,overground,elizabeth-line,tram`, { signal });
      if (searchRes.ok) {
        const topMatch = (await searchRes.json()).matches?.[0];
        if (topMatch) {
          const spRes = await fetch(`https://api.tfl.gov.uk/StopPoint/${topMatch.id}/Arrivals`, { signal });
          if (spRes.ok) matched.push(...(await spRes.json()).filter(p => servingLines.includes(p.lineId)));
        }
      }
    }
    const badgesHtml = servingLines.map(lid => { const c = LINE_COLORS[lid] || { hex:"#333", text:"#fff", name:lid }; return `<span class="line-badge" style="background:${c.hex}; color:${c.text}; font-size:12px; padding:4px 8px;">${escapeHtml(c.name)}</span>`; }).join(" ");
    if (matched.length === 0) {
      const emptyHtml = `<div style="margin-bottom:10px; display:flex; gap:6px; flex-wrap:wrap;">${badgesHtml}</div><div class="message">No live trains predicted for <strong>${escapeHtml(stationName)}</strong> right now.</div>`;
      if (container.dataset.rawHtml !== emptyHtml) { container.innerHTML = emptyHtml; container.dataset.rawHtml = emptyHtml; }
      return;
    }

    const grouped = {}; servingLines.forEach(lid => { grouped[lid] = {}; });
    matched.forEach(p => { const plat = p.platformName || p.direction || "Platform"; if (!grouped[p.lineId][plat]) grouped[p.lineId][plat] = []; grouped[p.lineId][plat].push(p); });
    
    let html = `<div class="departure-board">`; let count = 0;
    Object.keys(grouped).forEach(lid => {
      const pKeys = Object.keys(grouped[lid]); if (pKeys.length === 0) return; count++;
      const conf = LINE_COLORS[lid] || { hex: "#333", text: "#fff", name: lid };
      html += `<div class="dep-line-group"><div class="dep-line-header" style="background:${conf.hex}; color:${conf.text};"><span>${escapeHtml(conf.name)}</span><span style="font-size:11px; opacity:0.9;">Live Arrivals</span></div>`;
      pKeys.sort().forEach(plat => {
        const unique = [], seen = new Set();
        grouped[lid][plat].sort((a, b) => a.timeToStation - b.timeToStation).forEach(t => { const k = `${t.vehicleId}-${t.destinationName}-${Math.floor(t.timeToStation/30)}`; if(!seen.has(k)){ seen.add(k); unique.push(t); } });
        html += `<div class="dep-platform-group"><div class="dep-platform-title">${escapeHtml(plat)}</div>`;
        unique.slice(0, 4).forEach(t => {
          const dest = (t.destinationName || t.towards || "Check Front of Train").replace(/\s*(Underground|Rail|DLR)\s*Station/gi, '');
          const mins = Math.floor((t.timeToStation || 0) / 60), isDue = (t.timeToStation || 0) < 45;
          html += `<div class="dep-row"><div><span class="dep-dest">${escapeHtml(dest)}</span>${t.currentLocation ? `<span class="dep-loc">📍 ${escapeHtml(t.currentLocation)}</span>` : ''}</div><span class="dep-time ${isDue ? 'due' : ''}">${isDue ? 'Due' : (mins===1 ? '1 min' : mins+' mins')}</span></div>`;
        });
        html += `</div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
    
    if (container.dataset.rawHtml !== html && count > 0) { container.innerHTML = html; container.dataset.rawHtml = html; }
  } catch (err) { if (err.name !== 'AbortError') container.innerHTML = `<div class="message">Unable to load departures (${escapeHtml(err.message)}).</div>`; }
}

  });
  html += `</ul></div>`;

  active.forEach((item, idx) => {
    const c = LINE_COLORS[item.line] || { var: "var(--color-default)", hex: "#EE7C0E", text: "#fff", name: item.line.toUpperCase() };
    const fD = new Date(item.startDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }), tD = new Date(item.endDate).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    html += `<div class="works-card" id="work-card-${idx}"><div class="works-header"><span class="line-badge" style="background:${c.hex}; color:${c.text};">${escapeHtml(c.name)}</span><span class="works-date">📅 ${escapeHtml(fD)} — ${escapeHtml(tD)}</span></div><div style="font-size:13.5px; font-weight:600; line-height:1.4; margin-top:6px;">${escapeHtml(item.desc)}</div><details class="works-more-details" open><summary style="cursor:pointer; font-size:12.5px; font-weight:700; color:var(--status-planned); margin-top:6px;">Affected stations map</summary>${renderHorizontalWorksMap(item.line, item.desc)}</details></div>`;
  });
  
  const results = document.getElementById("results");
  if (results.dataset.rawHtml !== html) { results.innerHTML = html; results.dataset.rawHtml = html; }
  lastUpdatedTime = new Date(); updateRelativeTime();
}

function renderNetworkMap(data) {
  const modeGroups = { tube: { title: "London Underground, Elizabeth Line, DLR & Trams", lines: [] }, overground: { title: "London Overground Lines", lines: [] } };
  const ovgLines = [{ id: "mildmay", name: "Mildmay Line" }, { id: "windrush", name: "Windrush Line" }, { id: "weaver", name: "Weaver Line" }, { id: "suffragette", name: "Suffragette Line" }, { id: "lioness", name: "Lioness Line" }, { id: "liberty", name: "Liberty Line" }], ovgIds = new Set(ovgLines.map(o => o.id));
  
  data.forEach(l => { if (!(l.id === "london-overground" || l.modeName === "overground" || ovgIds.has(l.id))) modeGroups.tube.lines.push(l); });
  const ovgParent = data.find(l => l.id === "london-overground") || { lineStatuses: [{ statusSeverityDescription: "Good Service" }] };
  ovgLines.forEach(o => { const dl = data.find(l => l.id === o.id); modeGroups.overground.lines.push({ id: o.id, name: o.name, lineStatuses: dl ? dl.lineStatuses : ovgParent.lineStatuses }); });

  let html = `<div class="network-container"><div class="network-title">Interactive Network Overview</div>`;
  Object.values(modeGroups).forEach(g => {
    if (g.lines.length === 0) return;
    html += `<div class="network-section-heading">${escapeHtml(g.title)}</div><div class="network-grid">`;
    g.lines.forEach(l => {
      const sObj = l.lineStatuses?.[0], mC = classify(sObj?.statusSeverityDescription), c = LINE_COLORS[l.id] || { var: "var(--color-default)", text: "#fff" }, hd = mC.type !== "good", upc = getUpcomingWorkNotice(l.id);
      html += `<div class="network-card ${hd ? 'has-disruption' : ''}" style="--line-color: ${c.var}" onclick="openLineDetailView('${l.id}')"><div class="line-header" style="margin-bottom:8px;"><span class="line-badge" style="--badge-text: ${c.text}">${escapeHtml(l.name)}</span>${upc ? `<span class="planned-tag">🚧 Works</span>` : ''}</div><div class="status ${mC.type}" style="font-size:13.5px; text-align:left; margin-bottom:4px;">${escapeHtml(mC.label)}</div><div style="font-size:12px; color:${hd ? 'var(--status-closed)' : 'var(--text-muted)'}; font-weight:700;">${escapeHtml(hd ? '⚠️ View affected branches →' : '🗺️ View branch map & live trains →')}</div></div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  const results = document.getElementById("results");
  if (results.dataset.rawHtml !== html) { results.innerHTML = html; results.dataset.rawHtml = html; }
}

function updateRelativeTime() {
  if (!lastUpdatedTime) return;
  const s = Math.floor((new Date() - lastUpdatedTime) / 1000), e = document.getElementById("updated");
  if (s < 10) e.textContent = "Updated just now"; else if (s < 60) e.textContent = `Updated ${s}s ago`; else e.textContent = `Updated ${Math.floor(s / 60)}m ago`;
}

async function loadStatus() {
  if (statusAbortController) statusAbortController.abort(); statusAbortController = new AbortController();
  try {
    const res = await fetch(API_LIVE, { signal: statusAbortController.signal });
    if (!res.ok) throw new Error(`TfL Server HTTP ${res.status}`);
    cachedLiveMapData = await res.json();
    if (currentTab === "map" && !selectedLineDetailId) renderNetworkMap(cachedLiveMapData);
    lastUpdatedTime = new Date(); updateRelativeTime();
  } catch (err) {
    if (err.name !== 'AbortError') document.getElementById("updated").textContent = "Update failed";
  }
}

function setActiveTab(target) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); target.classList.add('active'); }

document.getElementById("tab-map").addEventListener("click", (e) => { currentTab = "map"; selectedLineDetailId = null; setActiveTab(e.target); document.getElementById("results").dataset.rawHtml = ""; if (cachedLiveMapData.length > 0) renderNetworkMap(cachedLiveMapData); else loadStatus(); });
document.getElementById("tab-trains").addEventListener("click", (e) => { currentTab = "trains"; selectedLineDetailId = null; setActiveTab(e.target); renderLiveTrainsTab(); });
document.getElementById("tab-works").addEventListener("click", (e) => { currentTab = "works"; selectedLineDetailId = null; setActiveTab(e.target); document.getElementById("results").dataset.rawHtml = ""; loadUpcomingWorks(); });
document.getElementById("btn-refresh").addEventListener("click", () => {
  if (currentTab === "works") loadUpcomingWorks(); else if (currentTab === "trains") { fetchLiveArrivalsForStation(selectedStationForTrains, "tab-live-board"); lastUpdatedTime = new Date(); updateRelativeTime(); } else loadStatus();
});

loadStatus();
setInterval(() => { if (currentTab === "map" && !selectedLineDetailId) loadStatus(); if (currentTab === "trains") fetchLiveArrivalsForStation(selectedStationForTrains, "tab-live-board"); }, 60000);
setInterval(updateRelativeTime, 10000);
</script>
</body>
</html>
